# Audience: contributors and assessors.
# Purpose: define the declarative test purposes for the credential profile family/credentials.
# This file is project-authored and synthetic. It makes no normative statement.
#
# Later packages add their test purposes to this file. Rules for a new entry:
# - The id starts with TP-VC-. It names one FAM-VC-... requirement in
#   catalogue/packs/family-illustrative.yaml, and that requirement names it back.
# - The applicability starts with `profile.id eq family/credentials` and equals the
#   applicability of the requirement. Every family profile selects every family test pack, so
#   this term keeps the step not applicable under the other family profiles.
# - Read ICS fields only (identifier_scheme, signature_format, granularity, features.*), never
#   ics.characteristics: a family profile declares no product fact.
# integrity.jws verifies a dpp+jws token with an x5c chain only. Another token type is an engine
# limit and gives inconclusive, not fail.
schema_version: dppce.testpack/1
testpack_id: family/credentials-core
version: 0.1.0
title: Verifiable credential test purposes
test_purposes:
- id: TP-VC-RESOLVE-001
  title: Resolve the credential URL
  requirements:
  - FAM-VC-RESOLVE-001
  profiles:
  - '*'
  applicability: &vc
    fact: profile.id
    op: eq
    value: family/credentials
  roles:
  - anonymous
  stimulus:
    check: identifier.resolve
    params:
      accepted_media_types:
      - application/json
      - application/ld+json
      - application/vc
      - application/vc+ld+json
      - application/vc+jwt
  expected_evidence:
  - The resolver exchange with its redirect chain.
  permitted_modes: &modes
  - illustrative
  - exploratory
- id: TP-VC-INTEGRITY-001
  title: Verify the signed credential
  requirements:
  - FAM-VC-INTEGRITY-001
  profiles:
  - '*'
  applicability:
    all:
    - *vc
    - fact: ics.signature_format
      op: eq
      value: jws
  roles:
  - anonymous
  stimulus:
    check: integrity.jws
  expected_evidence:
  - Separate findings for signature, issuer trust, certificate validity, revocation, and payload.
  permitted_modes: *modes
  severity: critical
