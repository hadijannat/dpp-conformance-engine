# Audience: contributors and assessors.
# Purpose: define the declarative test purposes for the credential profile family/credentials.
# This file is project-authored and synthetic. It makes no normative statement.
#
# Later packages add their test purposes to this file. Rules for a new entry:
# - The id starts with TP-VC-. It names one FAM-VC-... requirement in
#   catalogue/packs/family-illustrative.yaml, and that requirement names it back.
# - The applicability starts with `profile.id eq family/credentials` and equals the
#   applicability of the requirement. Every family profile selects every family test pack, so
#   this term keeps the step not applicable under the other family profiles.
# - Read ICS fields only (identifier_scheme, signature_format, granularity, features.*), never
#   ics.characteristics: a family profile declares no product fact.
# integrity.jws verifies a dpp+jws token with an x5c chain only. Another token type is an engine
# limit and gives inconclusive, not fail.
schema_version: dppce.testpack/1
testpack_id: family/credentials-core
version: 0.1.0
title: Verifiable credential test purposes
test_purposes:
- id: TP-VC-RESOLVE-001
  title: Resolve the credential URL
  requirements:
  - FAM-VC-RESOLVE-001
  profiles:
  - '*'
  applicability: &vc
    fact: profile.id
    op: eq
    value: family/credentials
  roles:
  - anonymous
  stimulus:
    check: identifier.resolve
    params:
      accepted_media_types:
      - application/json
      - application/ld+json
      - application/vc
      - application/vc+ld+json
      - application/vc+jwt
  expected_evidence:
  - The resolver exchange with its redirect chain.
  permitted_modes: &modes
  - illustrative
  - exploratory
- id: TP-VC-INTEGRITY-001
  title: Verify the signed credential
  requirements:
  - FAM-VC-INTEGRITY-001
  profiles:
  - '*'
  applicability:
    all:
    - *vc
    - fact: ics.signature_format
      op: eq
      value: jws
  roles:
  - anonymous
  stimulus:
    check: integrity.jws
  expected_evidence:
  - Separate findings for signature, issuer trust, certificate validity, revocation, and payload.
  permitted_modes: *modes
  severity: critical
# integrity.jose fetches the signed resource with Accept: application/vc+jwt. The reference system
# answers that request with a VC-JOSE credential and every other request as before.
- id: TP-VC-JOSE-001
  title: Verify the VC-JOSE credential with a pinned issuer key
  requirements:
  - FAM-VC-JOSE-001
  profiles:
  - '*'
  applicability:
    all:
    - *vc
    - fact: ics.signature_format
      op: eq
      value: jws
  roles:
  - anonymous
  stimulus:
    check: integrity.jose
    params:
      profile: vc-jose
      key_source: trust_kid
      source: signed
      accept: application/vc+jwt
  expected_evidence:
  - Separate findings for the serialization, the signature, the issuer key, and the credential validity.
  permitted_modes: *modes
  severity: critical
- id: TP-VC-DID-001
  title: Resolve the did:web document of the issuer
  requirements:
  - FAM-VC-DID-001
  profiles:
  - '*'
  applicability: *vc
  roles:
  - anonymous
  stimulus:
    check: identity.did
    params:
      # The DID of the reference system. For another DID, import a test pack with that DID.
      did: did:web:id.example.test
  expected_evidence:
  - The DID document exchange, or the IXIT sample that holds an offline copy of the DID document.
  permitted_modes: *modes
# A credential keeps the product identifier in credentialSubject.id, not in id. The IXIT sample
# vc_json is an unsigned JSON credential. Without it, the step is blocked, which is inconclusive.
- id: TP-VC-CONSISTENCY-001
  title: Compare the carrier identifier with the credential subject
  requirements:
  - FAM-VC-CONSISTENCY-001
  profiles:
  - '*'
  applicability: *vc
  roles:
  - anonymous
  stimulus:
    check: identifier.consistency
    params:
      sources:
      - label: vc_json
        kind: sample
        pointer: /credentialSubject/id
  expected_evidence:
  - The compared, the different, and the missing identifier sources.
  permitted_modes: *modes
  requires_scope: none
# integrity.status_list verifies the credential as TP-VC-JOSE-001 does, then fetches the status list
# credential that its BitstringStatusListEntry names. The list host must be an authorized origin.
- id: TP-VC-STATUS-001
  title: Check the W3C Bitstring Status List entry of the credential
  requirements:
  - FAM-VC-STATUS-001
  profiles:
  - '*'
  applicability:
    all:
    - *vc
    - fact: ics.signature_format
      op: eq
      value: jws
  roles:
  - anonymous
  stimulus:
    check: integrity.status_list
    params:
      key_source: trust_kid
      source: signed
      accept: application/vc+jwt
      list_source: live
      purpose: revocation
  expected_evidence:
  - The credential exchange, the status list credential exchange or sample, and separate findings for the
    list signature, the purpose, the list length, the index, the bit, and the ttl.
  permitted_modes: *modes
  severity: critical
# data.jsonschema verifies the credential as TP-VC-JOSE-001 does. Only a verified payload is judged,
# against the pinned TEST-ONLY payload schema. An unverified payload is blocked, not judged.
- id: TP-VC-PAYLOAD-001
  title: Validate the verified credential payload against its pinned schema
  requirements:
  - FAM-VC-PAYLOAD-001
  profiles:
  - '*'
  applicability:
    all:
    - *vc
    - fact: ics.signature_format
      op: eq
      value: jws
  roles:
  - anonymous
  stimulus:
    check: data.jsonschema
    params:
      source: credential_payload
      credential:
        profile: vc-jose
        key_source: trust_kid
        source: signed
        accept: application/vc+jwt
      schema: profiles/family/schemas/TEST-ONLY-vc-payload.schema.json
  expected_evidence:
  - The credential exchange, and the schema errors of the verified payload as JSON paths and keywords.
  permitted_modes: *modes
# The pinned draft-07 schema uses the keyword dependencies. Boundary case B-09 points the item template
# at a document that breaks it, so a validator that ignored the keyword would give a false pass.
- id: TP-VC-PASSPORT-001
  title: Validate the item passport against a pinned draft-07 schema
  requirements:
  - FAM-VC-PASSPORT-001
  profiles:
  - '*'
  applicability: *vc
  roles:
  - anonymous
  stimulus:
    check: data.jsonschema
    params:
      schema: profiles/family/schemas/TEST-ONLY-passport-draft07.schema.json
  expected_evidence:
  - The item passport exchange, and its schema errors as JSON paths and keywords.
  permitted_modes: *modes
