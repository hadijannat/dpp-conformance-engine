# Audience: reviewers, contributors, and assessors.
# Purpose: define the test purposes for the draft pack eu-battery/draft. Exploratory mode only.
# An automated step gives partial evidence. If its check fails, the step is inconclusive, because
# the checks compare with declarations and synthetic resources, not with the Regulation.
# A manual step has no result in the engine. No path can pass without its manual step.
schema_version: dppce.testpack/1
testpack_id: eu-battery/draft-tests
version: 0.1.0
title: Test purposes for the EU battery draft pack
test_purposes:
- id: TP-EU-QR-DECODE
  title: Decode the supplied image of the QR code
  purpose: 'Shows that the supplied image holds one QR symbol with text. It does not show that the code is on
    the battery, or its contrast, size, or permanence. Partial evidence only. A failed check gives ''inconclusive''
    with its reason code: a person must decide whether the observation contradicts the provision.'
  requirements:
  - EUBAT-13-6
  - EUBAT-13-6A
  - EUBAT-13-6B
  - EUBAT-77-3
  profiles:
  - '*'
  applicability:
    const: 'true'
    reason: Applies to every system that the parent requirement selects.
  roles:
  - anonymous
  stimulus:
    check: carrier.qr_decode
    params:
      artifact: qr_image
  expected_evidence:
  - The QR image as an artifact record.
  - The decode result or the reason code.
  verdict_rules:
    on_check_failed: inconclusive
    on_unreachable: inconclusive
  permitted_modes:
  - exploratory
  requires_scope: none
- id: TP-EU-ID-RESOLVE
  title: Resolve the identifier from the QR code as the anonymous role
  purpose: 'Shows that the identifier in the carrier leads to a resource without a credential. It does not show
    that the resource is the battery passport of that battery. The check expects a JSON object, which the Regulation
    does not require at this link. Partial evidence only. A failed check gives ''inconclusive'' with its reason
    code: a person must decide whether the observation contradicts the provision.'
  requirements:
  - EUBAT-13-6A
  - EUBAT-77-3
  profiles:
  - '*'
  applicability:
    const: 'true'
    reason: Applies to every system that the parent requirement selects.
  roles:
  - anonymous
  stimulus:
    check: identifier.resolve
  expected_evidence:
  - The resolver exchange with its redirect chain.
  - The final status code and media type.
  verdict_rules:
    on_check_failed: inconclusive
    on_unreachable: inconclusive
  permitted_modes:
  - exploratory
  requires_scope: read
- id: TP-EU-API-CONTRACT
  title: Compare the passport response with the API contract that the owner of the system pins
  purpose: 'Shows that the response is machine-readable and has the declared structure. The contract and its path
    come from the profile, not from the Regulation. Partial evidence only. A failed check gives ''inconclusive''
    with its reason code: a person must decide whether the observation contradicts the provision.'
  requirements:
  - EUBAT-77-5
  profiles:
  - '*'
  applicability:
    const: 'true'
    reason: Applies to every system that the parent requirement selects.
  roles:
  - anonymous
  stimulus:
    check: api.contract
    params:
      path: /dpp/{id}
      method: get
  expected_evidence:
  - Status, media type, and schema result.
  verdict_rules:
    on_check_failed: inconclusive
    on_unreachable: inconclusive
  permitted_modes:
  - exploratory
  requires_scope: read
- id: TP-EU-ACCESS-ANON
  title: Probe the channels as the anonymous role against the declared access policy
  purpose: 'Shows whether the anonymous role gets a field that the declared access policy withholds. The policy
    is a declaration of the owner of the system. The engine cannot confirm that it matches the access groups of
    Article 77(2). Partial evidence only. A failed check gives ''inconclusive'' with its reason code: a person
    must decide whether the observation contradicts the provision.'
  requirements:
  - EUBAT-77-2-ACCESS
  - EUBAT-78-F
  profiles:
  - '*'
  applicability:
    const: 'true'
    reason: Applies to every system that the parent requirement selects.
  roles:
  - anonymous
  stimulus:
    check: access.restricted_fields
    params:
      role: anonymous
  expected_evidence:
  - Channel names and field paths. Never field values.
  verdict_rules:
    on_check_failed: inconclusive
    on_unreachable: inconclusive
  permitted_modes:
  - exploratory
  requires_scope: access_probe
- id: TP-EU-INTEGRITY-JWS
  title: Verify the signed passport where the system declares a JWS signature
  purpose: 'Shows signature validity, issuer trust, and certificate validity for the declared mechanism. The Regulation
    names no mechanism. A valid signature does not prove that the signed values are true. Partial evidence only.
    A failed check gives ''inconclusive'' with its reason code: a person must decide whether the observation contradicts
    the provision.'
  requirements:
  - EUBAT-78-G
  profiles:
  - '*'
  applicability:
    fact: ics.signature_format
    op: eq
    value: jws
  roles:
  - anonymous
  stimulus:
    check: integrity.jws
  expected_evidence:
  - Separate findings for signature, issuer trust, certificate validity, revocation, and payload.
  verdict_rules:
    on_check_failed: inconclusive
    on_unreachable: inconclusive
  permitted_modes:
  - exploratory
  requires_scope: read
