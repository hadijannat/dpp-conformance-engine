# Audience: contributors and assessors.
# Purpose: define the declarative test purposes for the profile family/oauth.
# This file is project-authored and synthetic. It makes no normative statement.
#
# Rules for a new entry:
# - The id starts with TP-OAUTH-. It names one FAM-OAUTH-... requirement in
#   catalogue/packs/family-illustrative.yaml, and that requirement names it back.
# - The applicability starts with `profile.id eq family/oauth` and equals the applicability of the
#   requirement.
schema_version: dppce.testpack/1
testpack_id: family/oauth-core
version: 0.1.0
title: OAuth 2.0 client credentials test purposes
test_purposes:
- id: TP-OAUTH-ACCESS-001
  title: Probe the channels as a role with an OAuth 2.0 client credentials token
  requirements:
  - FAM-OAUTH-ACCESS-001
  profiles:
  - '*'
  applicability:
    fact: profile.id
    op: eq
    value: family/oauth
  roles:
  - legitimate_interest
  stimulus:
    check: access.restricted_fields
    params:
      role: legitimate_interest
  expected_evidence:
  - Channel names and field paths. Never field values, the client secret, or the token.
  permitted_modes:
  - illustrative
  - exploratory
  requires_scope: access_probe
  severity: critical
