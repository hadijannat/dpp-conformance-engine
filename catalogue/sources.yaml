  evidence:
  - url: https://publications.europa.eu/resource/cellar/d86c4599-ac88-11f1-b9e5-01aa75ed71a1.0007.02/DOC_1
    what_it_shows: 'English consolidated version 13.08.2026 (003.001): front matter with M1 to M3 and C1 to C4;
      Articles 1, 3, 7, 8, 10, 13, 14, 38, 45, 47, 48, 52, 77, 78, 89, 94 to 96 and Annexes VI, VII, XIII read.
      Short exact quotations for Article 77(1) to (4) and (7) to (10).'
    official: true
  - url: https://publications.europa.eu/resource/cellar/d0065c31-2ce3-11ee-95a2-01aa75ed71a1.0006.03/DOC_1
    what_it_shows: 'Original OJ text (EN), OJ L 191, 28.7.2023: recitals 123 to 126, the original Article 1(6),
      and the original Annex XIII point 1(q). Second route for Article 77(1).'
    official: true
  - url: https://eur-lex.europa.eu/eli/reg/2023/1542/2026-08-13/eng
    what_it_shows: 'EUR-Lex consolidated version (read by the independent check): header ''02023R1542 - EN - 13.08.2026
      - 003.001''; same amendment list; Article 77 has one marker (C2 on paragraph 10); Article 78 has none.'
    official: true
  uncertainties:
  - The text was read through a summarizing fetch tool. Article 77(1) to (4) and (7) to (10) were confirmed with
    short exact quotations. Other provisions are paraphrase and were not compared character by character.
  - The consolidated version is a documentation tool without legal effect. The Official Journal text with its
    corrigenda and amending acts is authentic.
  - The amendment list (M1 to M3; C1 to C4 of the English edition) comes from the front matter of the consolidated
    version of 2026-08-13. An act published later would not appear there. None was located.
  - Corrigenda differ by language edition. Only the English text was examined.
  - 'Not read: Article 57; Article 74(1), points (a) to (f); the consolidated versions of 2024-07-18 and 2025-07-31.'
  - 'Correction after the independent check: the first pass recorded the content of corrigendum C2 as an inference.
    The independent check opened it; see amendment_history.'
  - Four pending proposals (procedures 2025/0130(COD), 2025/0134(COD), 2025/0397(COD), 2025/0395(COD)) could amend
    this Regulation. None is law as of 2026-10-13.
