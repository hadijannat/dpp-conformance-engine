    what_it_shows: '27 ''required'' arrays enumerated (read twice via the fetch tool with identical results).
      Root required: @context, id, issuer, validFrom, name, credentialSubject. type, validUntil, credentialStatus,
      renderMethod, issuingSoftware are optional. @context prefixItems fix the first two entries to https://www.w3.org/ns/credentials/v2
      and https://vocabulary.uncefact.org/untp/0.7.0/context/. If present, type must contain DigitalConformityCredential
      and VerifiableCredential. Root additionalProperties true.'
    official: true
  - url: https://untp.unece.org/artefacts/schema/v0.7.0/dcc/ConformityAttestation.json
    what_it_shows: 'Standalone subject schema; required: id, name, assessorLevel, assessmentLevel, attestationType,
      issuedToParty, referenceScheme; ConformityAssessment required: id, name, assessmentCriteria, assessmentDate,
      assessedPerformance, conformityTopic'
    official: true
  - url: https://untp.unece.org/docs/0.7.0/specification/ConformityCredential
    what_it_shows: Prose requirements CC-01, CC-03, CC-05, CC-06, CC-07 used for the cross-check
    official: true
  uncertainties:
  - 'SCHEMA vs PROSE: the page''s prose CC-05 says the assessment MUST state conformant or not, but ''conformance''
    (boolean) is a property of ConformityAssessment that is NOT in its required array. A schema-only validator
    will accept an assessment without it.'
  - 'SCHEMA vs PROSE: prose CC-06 says assessedPerformance SHOULD be present, but the schema lists assessedPerformance
    as required.'
  - 'SCHEMA vs PROSE: the page''s prose places conformityTopic under assessment criteria, while the schema requires
    conformityTopic at ConformityAssessment level (and not inside the assessmentCriteria item required list of
    id, name).'
  - The top-level 'type' property is not in the root required array, so the DigitalConformityCredential/VerifiableCredential
    constraint only applies if type is present. The credential subject's type (ConformityAttestation) is also
    not required.
