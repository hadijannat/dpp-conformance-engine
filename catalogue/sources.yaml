- id: reg-eu-2023-1542
  title: Regulation (EU) 2023/1542 of the European Parliament and of the Council of 12 July 2023 concerning batteries
    and waste batteries, amending Directive 2008/98/EC and Regulation (EU) 2019/1020 and repealing Directive 2006/66/EC
    (Text with EEA relevance)
  identifier: 'CELEX 32023R1542; ELI http://data.europa.eu/eli/reg/2023/1542/oj; consolidated version examined:
    CELEX 02023R1542-20260813 (EN 003.001)'
  issuing_body: European Parliament and Council of the European Union
  source_type: eu_regulation
  official_url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
  edition_or_version: 'Original: OJ L 191, 28.7.2023, p. 1. Consolidated versions located: 2023-07-28, 2024-07-18,
    2025-07-31, 2026-08-13 (latest; incorporates M1-M3 and corrigenda C1-C4 of the English edition).'
  publication_date: '2023-07-28'
  retrieval_date: '2026-10-13'
  legal_or_spec_status: in force; applicable in stages (general application from 2024-02-18); amended three times
    and corrected (English edition) three times plus one corrigendum to an amending act, as of the 2026-08-13
    consolidated version
  applicable_dates:
  - date: '2023-08-17'
    what: Entry into force (twentieth day following publication in OJ L 191 of 28.7.2023). The date itself is
      computed from Art. 96(1) and is also stated on the Commission DG ENV batteries page and implied by Art.
      89(2) ('five years from 17 August 2023').
    basis: Art. 96(1); Art. 89(2); https://environment.ec.europa.eu/topics/waste-and-recycling/batteries_en
  - date: '2024-02-18'
    what: General date of application
    basis: Art. 96(2) introductory wording
  - date: '2024-08-18'
    what: Article 17 and Chapter VI (obligations of economic operators) apply, except Art. 17(2) which applies
      12 months after first publication of the list in Art. 30(2); Art. 10(1) performance and durability documentation;
      Art. 12(2) SBESS safety documentation; Art. 14(1) state-of-health data in the BMS; Annex I lead limit for
      portable batteries
    basis: Art. 96(2)(b); Art. 10(1); Art. 12(2); Art. 14(1); Annex I as replaced by Regulation (EU) 2026/1738
  - date: '2025-08-18'
    what: Chapter VIII (management of waste batteries) applies; Directive 2006/66/EC repealed (with transitional
      carve-outs); Art. 13(4) separate-collection symbol applies; statutory deadline for the Art. 13(10) labelling
      implementing act and Art. 76(5) implementing acts
    basis: Art. 96(2)(c); Art. 95; Art. 13(4); Art. 13(10); Art. 76(5)
  - date: '2026-07-26'
    what: Deadline for Commission due diligence guidelines (as amended by Regulation (EU) 2025/1561; originally
      2025-02-18)
    basis: Art. 48(5) as amended (M2)
  - date: '2026-08-18'
    what: Earliest possible date for Art. 13(1)-(3) labels (actual date is the later of this date and 18 months
      after entry into force of the Art. 13(10) implementing act); statutory deadline for the Art. 77(9) implementing
      act; statutory deadline for the Art. 8(1) recycled-content methodology delegated act
    basis: Art. 13(1)-(3); Art. 77(9); Art. 8(1) third subparagraph
  - date: '2027-02-18'
    what: Art. 13(6) QR code on all batteries; Art. 77(1) battery passport for each LMT battery, each industrial
      battery with a capacity greater than 2 kWh and each electric vehicle battery placed on the market or put
      into service; Art. 11 (removability and replaceability) applies
    basis: Art. 13(6); Art. 77(1); Art. 96(2)(a)
  - date: '2027-08-18'
    what: Battery due diligence obligations apply (as amended by Regulation (EU) 2025/1561; originally 2025-08-18)
    basis: Art. 48(1) as amended (M2)
  - date: '2028-08-18'
    what: Earliest possible date for Art. 8(1) recycled-content documentation (later of this date and 24 months
      after entry into force of the Art. 8(1) delegated act)
    basis: Art. 8(1) first subparagraph
  - date: '2031-06-30'
    what: Commission review report, including Chapter III labelling and Chapter IX battery passport
    basis: Art. 94(1)-(2)
  amendment_history:
  - identifier: C1 - Corrigendum, OJ L, 2024/90243, 17.4.2024 (ELI http://data.europa.eu/eli/reg/2023/1542/corrigendum/2024-04-17/oj)
    date: '2024-04-17'
    summary: 'Art. 1(6): ''Chapters III and VIII'' corrected to ''Chapters III and IX''; Art. 92: reference to
      the battery definition corrected from ''Article 2, point (1)'' to ''Article 3(1), point (1)''. Opened and
      read on 2026-10-13.'
    url: https://publications.europa.eu/resource/cellar/e32af6c0-fc54-11ee-a251-01aa75ed71a1.0006.03/DOC_1
  - identifier: M1 - Regulation (EU) 2024/1781 (ESPR), OJ L, 2024/1781, 28.6.2024
    date: '2024-06-28'
    summary: ESPR Art. 78 adds paragraph 10 to Art. 77 of Regulation (EU) 2023/1542 (upload of the unique identifier
      to the ESPR Art. 13(1) registry). The added paragraph carries no date of its own.
    url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
  - identifier: C2 - Corrigendum to Regulation (EU) 2024/1781, OJ L, 2024/90493, 7.8.2024
    date: '2024-08-07'
    summary: Corrigendum to Regulation (EU) 2024/1781, the amending act M1. It replaces Articles 77 and 78 of
      that Regulation. The corrected Article 78 inserts Article 77(10) with a reference to the registry of Article
      13(1) of Regulation (EU) 2024/1781. Opened and read by the independent check.
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02023R1542-20260813
  - identifier: M2 - Regulation (EU) 2025/1561, OJ L, 2025/1561, 30.7.2025
    date: '2025-07-30'
    summary: 'Postpones due diligence: Art. 48(1) ''18 August 2025'' replaced by ''18 August 2027''; Art. 48(5)
      ''18 February 2025'' replaced by ''26 July 2026''. Enters into force the day after publication.'
    url: https://eur-lex.europa.eu/eli/reg/2025/1561/oj
  - identifier: C3 - Corrigendum, OJ L, 2025/90794, 8.10.2025 (ELI http://data.europa.eu/eli/reg/2023/1542/corrigendum/2025-10-08/oj)
    date: '2025-10-08'
    summary: 'Art. 32(4): committee-procedure cross-reference corrected from Article 74(2) to Article 90(2). Opened
      and read on 2026-10-13. Not relevant to labelling or passport.'
    url: https://publications.europa.eu/resource/cellar/8cc766e0-a3e2-11f0-97c8-01aa75ed71a1.0006.03/DOC_1
  - identifier: C4 - Corrigendum, OJ L, 2026/90285, 10.4.2026 (ELI http://data.europa.eu/eli/reg/2023/1542/corrigendum/2026-04-10/oj)
    date: '2026-04-10'
    summary: 'Annex XIII point 1(q): ''the marking requirements laid down in Article 13(3) and (4)'' corrected
      to ''Article 13(4) and (5)''. Opened and read on 2026-10-13. Directly changes battery passport content.'
    url: https://publications.europa.eu/resource/cellar/0247a0f6-3476-11f1-be39-01aa75ed71a1.0006.03/DOC_1
  - identifier: M3 - Regulation (EU) 2026/1738 (end-of-life vehicles), OJ L, 2026/1738, 24.7.2026
    date: '2026-07-24'
    summary: 'Art. 53 and Annex XII replace the table in Annex I (restricted substances: mercury, cadmium, lead,
      hexavalent chromium, with vehicle-battery entries moved from the ELV Directive). Art. 53 applies from 13
      August 2026. No change to Art. 13, Art. 77, Art. 78, Annex VI or Annex XIII was found.'
    url: https://eur-lex.europa.eu/eli/reg/2026/1738/oj
  oj_citation:
    status: not_applicable
    reference: The act itself is published as OJ L 191, 28.7.2023, p. 1. This is not a standards citation.
    url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
