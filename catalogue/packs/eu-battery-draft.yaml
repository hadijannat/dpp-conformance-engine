- id: EUBAT-77-1
  title: Each battery in scope has a battery passport
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 77(1)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: From 18 February 2027, each LMT battery, each industrial battery with a capacity greater than 2
    kWh, and each electric vehicle battery that is placed on the market or put into service has an electronic
    record, the battery passport.
  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: manual
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-77-1-I1
    text: 'Agent-authored draft reading of Art. 77(1). Not approved. Support: docs/research/raw/batteries-regulation.json.
      The audit obtained short exact quotations for this paragraph, and both independent checks (docs/research/raw/batteries-regulation.refutation.json,
      docs/research/raw/commission-2026-acts.refutation.json) confirmed it. The capacity limit belongs to the
      industrial category only and is strictly greater than 2000 Wh. The word ''each'' means one record for each
      battery. No automated step is listed: a link that resolves shows access under Article 77(3), not that one
      record exists for each battery.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - The Regulation does not define 'capacity' for the 2 kWh limit. The fact capacity_wh is a declared energy
      value. Commission FAQ material (non-binding) says that independent units are assessed one by one and integrated
      systems by their combined capacity.
    - 'The exclusions of Article 1(5) and (6) (military, space, and nuclear safety equipment) are not in the expression:
      the profile declares no fact for them.'
    - The expression gives 'true' when a put-into-service date on or after 2027-02-18 is declared, also for a
      battery that was placed on the market before that date. Article 3(1), point (18) limits putting into service
      to a battery that was not placed on the market before. The expression language cannot state that limit.
    - The Regulation does not say expressly whether a battery that was placed on the market before 2027-02-18
      needs a passport after a later change of status. Commission FAQ material (non-binding) says that a new passport
      is needed if such a battery is remanufactured after that date.
    - Article 77(1) says 'industrial battery', and Articles 7(1), 8(1), and 10(1) say 'rechargeable industrial
      batteries'. A non-rechargeable industrial battery above 2 kWh is inside Article 77(1).
  assessment_paths:
  - id: default
    description: One manual step. The engine has no check for this provision.
    tests:
    - TP-EU-77-1-MANUAL
- id: EUBAT-77-2-CONTENT
  title: The passport holds model information and individual battery information
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 77(2) (content of the passport)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: The battery passport holds information on the battery model and information on the individual battery,
    including information from its use, as Annex XIII sets out. An item is included to the extent that it applies
    to the category or sub-category of the battery.
  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: manual
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-77-2-CONTENT-I1
    text: 'Agent-authored draft reading of Art. 77(2) (content of the passport). Not approved. Support: docs/research/raw/batteries-regulation.json.
      The single items are in the EUBAT-AXIII entries. Their start dates differ: see EUBAT-AXIII-1C, EUBAT-AXIII-1D,
      and EUBAT-AXIII-1E. The engine has no normative data model for the passport, so no schema check is listed.
      The schemas of the profile are synthetic.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - The Regulation has no table of items for each category or sub-category. Commission guidance version 2.0
      gives one. That guidance is not binding.
    - No delegated act that amends Annex XIII was located. The Commission can adopt one under Article 77(2).
    - The audit read this provision through a summarizing fetch tool. The wording was not compared character by
      character with the Official Journal.
  assessment_paths:
  - id: default
    description: One manual step. The engine has no check for this provision.
    tests:
    - TP-EU-77-2-CONTENT-MANUAL
- id: EUBAT-77-2-ACCESS
  title: The information is accessible in three groups
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 77(2), points (a) to (c)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: The general public gets the information of Annex XIII point 1. Notified bodies, market surveillance
    authorities, and the Commission get points 2 and 3. Persons with a legitimate interest get points 2 and 4,
    for the purposes that the paragraph names.
  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: mixed
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-77-2-ACCESS-I1
    text: 'Agent-authored draft reading of Art. 77(2), points (a) to (c). Not approved. Support: docs/research/raw/batteries-regulation.json.
      The boundary between public and restricted information follows from Article 77(2) and Annex XIII without
      a further act. The automated step observes the anonymous role only. It uses the access policy that the owner
      of the system declares.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Who is a person with a legitimate interest, and what such a person may download, share, publish, and re-use,
      depends on the Article 77(9) implementing act. No adopted act was located as of 2026-10-13. The deadline
      of 2026-08-18 is addressed to the Commission and does not show adoption.
    - Article 77(2), point (b) gives notified bodies, market surveillance authorities, and the Commission the
      points 2 and 3 only. The heading of point 4 names only persons with a legitimate interest. Authority access
      to point 4 is not resolved.
    - The engine cannot confirm that the declared access policy matches the groups of Article 77(2). The manual
      step must compare them.
  assessment_paths:
  - id: default
    description: Every step is needed. The manual step decides. An automated step alone cannot give a pass.
    tests:
    - TP-EU-ACCESS-ANON
    - TP-EU-77-2-ACCESS-MANUAL
