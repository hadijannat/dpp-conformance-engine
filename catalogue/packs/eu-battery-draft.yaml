  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: mixed
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-77-3-I1
    text: 'Agent-authored draft reading of Art. 77(3), first subparagraph. Not approved. Support: docs/research/raw/batteries-regulation.json.
      The audit obtained short exact quotations for this paragraph. The automated steps show that a supplied code
      decodes and that its link resolves without a credential. They do not show who attributed the identifier
