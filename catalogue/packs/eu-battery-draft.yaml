    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Article 13(6) states the date and no trigger event. This draft applies the date to the placing on the market
