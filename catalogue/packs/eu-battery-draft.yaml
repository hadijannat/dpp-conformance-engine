# Audience: reviewers, contributors, and assessors.
# Purpose: hold agent-authored DRAFT interpretations of Regulation (EU) 2023/1542 for review.
# No entry is approved. This file is not legal advice and makes no statement of legal compliance.
# Review each entry with catalogue/templates/interpretation-review.md.
schema_version: dppce.pack/1
pack_id: eu-battery/draft
version: 0.1.0
title: 'EU battery passport: agent-authored draft interpretations'
description: 'Draft interpretations of Regulation (EU) 2023/1542 for the battery passport and its data carrier.
  An agent wrote them from the source audit. No entry is approved and no human reviewed them. The audit read the
  consolidated text, which is a documentation tool and has no legal effect: the Official Journal text with its
  corrigenda is the authentic text. A result from this pack is diagnostic. It is not a statement of legal compliance.'
legal_as_of: '2026-10-13'
scope_statement: Covers Article 13(6), first sentence and points (a) and (b), with Annex VI, Part C, and Article
  13(7); Article 77(1) to (8) and (10); Article 78, points (a) to (h); and Annex XIII, points 1 to 4, of Regulation
  (EU) 2023/1542, in the consolidated version of 2026-08-13. It does not cover Article 13(6), point (c), Article
  77(9) (addressed to the Commission), the rest of the Regulation, any act that was not adopted on 2026-10-13,
  or the content of any standard. A count of these entries is not coverage of the Regulation.
requirements:
- id: EUBAT-13-6
  title: The battery bears a QR code
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 13(6), first sentence; Annex VI, Part C
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: From 18 February 2027, a battery is marked with a QR code. The code has a high color contrast with
    its background and a size that a commonly available QR reader reads easily.
  applicability:
    any:
    - fact: ics.characteristics.placed_on_market_date
      op: ge
      value: '2027-02-18'
    - fact: ics.characteristics.put_into_service_date
      op: ge
      value: '2027-02-18'
  testability: mixed
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-13-6-I1
    text: 'Agent-authored draft reading of Art. 13(6), first sentence; Annex VI, Part C. Not approved. Support:
      docs/research/raw/batteries-regulation.json. The duty covers every battery category, so the expression holds
      the date only. The independent check in docs/research/raw/batteries-regulation.refutation.json confirmed
      the date. Decoding a supplied image is partial evidence: it does not show the marking on the battery.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Article 13(6) states the date and no trigger event. This draft applies the date to the placing on the market
      or the putting into service of the battery, as Article 77(1) does. A reviewer must confirm that reading.
    - Annex VI, Part C names no symbology standard and no numeric limit for contrast or size.
    - 'The exclusions of Article 1(5) and (6) (military, space, and nuclear safety equipment) are not in the expression:
      the profile declares no fact for them.'
    - The expression gives 'true' when a put-into-service date on or after 2027-02-18 is declared, also for a
      battery that was placed on the market before that date. Article 3(1), point (18) limits putting into service
      to a battery that was not placed on the market before. The expression language cannot state that limit.
  assessment_paths:
  - id: default
    description: Every step is needed. The manual step decides. An automated step alone cannot give a pass.
    tests:
    - TP-EU-QR-DECODE
    - TP-EU-13-6-MANUAL
- id: EUBAT-13-6A
  title: The QR code gives access to the battery passport
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 13(6), point (a)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: For an LMT battery, an industrial battery with a capacity greater than 2 kWh, and an electric vehicle
    battery, the QR code gives access to the battery passport of Article 77. The information is complete, up to
    date, and accurate.
  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: mixed
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-13-6A-I1
    text: 'Agent-authored draft reading of Art. 13(6), point (a). Not approved. Support: docs/research/raw/batteries-regulation.json.
      The category list and the limit are those of Article 77(1). The capacity limit is in the industrial branch
      only and the comparison is strictly greater than 2000 Wh. The two automated steps show that a supplied code
      decodes and that its link resolves.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Article 13(6) states the date and no trigger event. This draft applies the date to the placing on the market
      or the putting into service of the battery, as Article 77(1) does. A reviewer must confirm that reading.
    - Article 13(6) ends with the duty that the information is complete, up to date, and accurate. The audit did
      not record how that sentence relates to each point of the paragraph.
    - The Regulation does not define 'capacity' for the 2 kWh limit. The fact capacity_wh is a declared energy
      value. Commission FAQ material (non-binding) says that independent units are assessed one by one and integrated
      systems by their combined capacity.
    - 'The exclusions of Article 1(5) and (6) (military, space, and nuclear safety equipment) are not in the expression:
      the profile declares no fact for them.'
    - The expression gives 'true' when a put-into-service date on or after 2027-02-18 is declared, also for a
      battery that was placed on the market before that date. Article 3(1), point (18) limits putting into service
      to a battery that was not placed on the market before. The expression language cannot state that limit.
  assessment_paths:
  - id: default
    description: Every step is needed. The manual step decides. An automated step alone cannot give a pass.
    tests:
    - TP-EU-QR-DECODE
    - TP-EU-ID-RESOLVE
    - TP-EU-13-6A-MANUAL
