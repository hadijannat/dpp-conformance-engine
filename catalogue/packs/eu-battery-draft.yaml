- id: EUBAT-AXIII-1
  title: Public model information that is due with the passport
  source:
    source_id: reg-eu-2023-1542
    citation: Annex XIII, point 1(a), (b), (f) to (j), and (l) to (s)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: The public part of the passport holds the model information of these items, for example the information
    of Annex VI Part A, the material composition, the rated capacity, the voltages, the expected lifetime, the
    marking information, the EU declaration of conformity, and the information on the prevention and management
    of waste batteries.
  applicability:
    all:
    - any:
      - fact: ics.product_category
        op: in
        value:
        - lmt
        - ev
      - all:
        - fact: ics.product_category
          op: eq
          value: industrial
        - fact: ics.characteristics.capacity_wh
          op: gt
          value: 2000
    - any:
      - fact: ics.characteristics.placed_on_market_date
        op: ge
        value: '2027-02-18'
      - fact: ics.characteristics.put_into_service_date
        op: ge
        value: '2027-02-18'
  testability: manual
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-AXIII-1-I1
    text: 'Agent-authored draft reading of Annex XIII, point 1(a), (b), (f) to (j), and (l) to (s). Not approved.
      Support: docs/research/raw/batteries-regulation.json. The audit found no later start date behind these items.
      Items (c), (d), (e), and (k) are separate entries because their dates or categories differ.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Item (q) refers to Article 13(4) and (5) after the corrigendum OJ L, 2026/90285 of 2026-04-10. Older copies
      of the text refer to Article 13(3) and (4).
    - Item (a) uses the data of Annex VI Part A. The label duty for the same data (Article 13(1)) has its own
      start date, which is not fixed. As passport content the data are due with the passport.
    - Article 77(2) limits each item to what applies to the category or sub-category. The Regulation has no table
      for that. Commission guidance version 2.0 has one and is not binding.
    - The audit did not read Article 74(1), points (a) to (f), which item (s) names.
    - The Commission guidance lists a data point for an 'Annex XIII 1(t)'. The consolidated text of 2026-08-13
      has no item (t).
    - The audit read this provision through a summarizing fetch tool. The wording was not compared character by
      character with the Official Journal.
  assessment_paths:
  - id: default
    description: One manual step. The engine has no check for this provision.
    tests:
    - TP-EU-AXIII-1-MANUAL
