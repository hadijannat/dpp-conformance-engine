    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - The paragraph names only the economic operator that places the battery on the market. It does not say who
      has the duty when a battery is put into service without being placed on the market.
    - One sample cannot show that an identifier is unique.
    - The Regulation does not define 'capacity' for the 2 kWh limit. The fact capacity_wh is a declared energy
      value. Commission FAQ material (non-binding) says that independent units are assessed one by one and integrated
      systems by their combined capacity.
    - 'The exclusions of Article 1(5) and (6) (military, space, and nuclear safety equipment) are not in the expression:
      the profile declares no fact for them.'
    - The expression gives 'true' when a put-into-service date on or after 2027-02-18 is declared, also for a
      battery that was placed on the market before that date. Article 3(1), point (18) limits putting into service
      to a battery that was not placed on the market before. The expression language cannot state that limit.
  assessment_paths:
  - id: default
    description: Every step is needed. The manual step decides. An automated step alone cannot give a pass.
    tests:
    - TP-EU-QR-DECODE
    - TP-EU-ID-RESOLVE
    - TP-EU-77-3-MANUAL
- id: EUBAT-77-3-STD
  title: The QR code and the unique identifier comply with the named ISO/IEC editions or an equivalent
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 77(3), second subparagraph
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
