- id: EUBAT-13-7-QR
  title: The QR code is printed or engraved on the battery
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 13(7) (QR code)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: The QR code is printed or engraved on the battery so that it is visible, legible, and indelible.
    Where the nature and size of the battery make that impossible or unwarranted, the code is on the packaging
    and on the documents that accompany the battery.
  applicability:
    any:
    - fact: ics.characteristics.placed_on_market_date
      op: ge
      value: '2027-02-18'
    - fact: ics.characteristics.put_into_service_date
      op: ge
      value: '2027-02-18'
  testability: manual
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-13-7-QR-I1
    text: 'Agent-authored draft reading of Art. 13(7) (QR code). Not approved. Support: docs/research/raw/batteries-regulation.json.
      This entry covers the QR code only. It starts with the QR code duty of Article 13(6). The labels are in
      EUBAT-13-7-LABELS because their start dates differ. No engine check can observe a physical marking.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
    unresolved:
    - Article 13(6) states the date and no trigger event. This draft applies the date to the placing on the market
      or the putting into service of the battery, as Article 77(1) does. A reviewer must confirm that reading.
    - The Regulation gives no test method for 'indelibly' and no criterion for 'not possible or not warranted'.
    - 'The exclusions of Article 1(5) and (6) (military, space, and nuclear safety equipment) are not in the expression:
      the profile declares no fact for them.'
    - The expression gives 'true' when a put-into-service date on or after 2027-02-18 is declared, also for a
      battery that was placed on the market before that date. Article 3(1), point (18) limits putting into service
      to a battery that was not placed on the market before. The expression language cannot state that limit.
  assessment_paths:
  - id: default
    description: One manual step. The engine has no check for this provision.
    tests:
    - TP-EU-13-7-QR-MANUAL
- id: EUBAT-13-7-LABELS
  title: The labels are printed or engraved on the battery
  source:
    source_id: reg-eu-2023-1542
    citation: Art. 13(7) (labels)
    version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
  authority_class: legal_obligation
  modality: mandatory
  paraphrase: The labels of Article 13 are printed or engraved on the battery so that they are visible, legible,
    and indelible, or are on the packaging and the accompanying documents where that is impossible or unwarranted.
  applicability:
    const: unknown
    reason: The label duties start on different dates. Article 13(1) to (3) start on the later of 2026-08-18 and
      18 months after the entry into force of the Article 13(10) implementing act. That act was not located as
      adopted as of 2026-10-13. Article 13(4) applies from 2025-08-18. Article 13(5) states no date.
  testability: manual
  review_status: draft-needs-review
  interpretations:
  - id: EUBAT-13-7-LABELS-I1
    text: 'Agent-authored draft reading of Art. 13(7) (labels). Not approved. Support: docs/research/raw/batteries-regulation.json.
      The entry is here so that the label part of Article 13(7) is visible. Labels are not the data carrier of
      the passport. The independent check in docs/research/raw/batteries-regulation.refutation.json confirmed
      that the start of Article 13(1) to (3) is not fixed.'
    status: draft-needs-review
    author_kind: agent
    source_version: CELEX 02023R1542-20260813 (consolidated version of 2026-08-13, EN 003.001)
