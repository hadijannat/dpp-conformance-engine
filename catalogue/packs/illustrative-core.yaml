# Audience: contributors and assessors.
# Purpose: demonstrate engine behavior with synthetic rules. No rule here states a legal or standard requirement.
# This file is project-authored and synthetic. It makes no normative statement.
schema_version: dppce.pack/1
pack_id: illustrative/core
version: 0.2.0
title: Illustrative core rules
description: Synthetic rules for the local reference system.
scope_statement: Synthetic demonstration rules only. This pack covers no law and no standard.
