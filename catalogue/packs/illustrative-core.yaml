    source_id: dppce-illustrative
  authority_class: illustrative
  modality: mandatory
  paraphrase: The QR image decodes to one symbol with text.
  applicability:
    fact: ics.carriers
    op: contains
    value: qr
  testability: automated
  review_status: draft-needs-review
  interpretations:
  - id: ILL-CARRIER-001-I1
