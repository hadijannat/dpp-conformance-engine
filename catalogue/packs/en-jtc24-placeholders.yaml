# Audience: contributors and assessors.
# Purpose: keep one placeholder for each CEN/CLC/JTC 24 standard. Bibliographic data only.
# No entry states, quotes, paraphrases, or summarizes the content of a standard.
schema_version: dppce.pack/1
pack_id: en-jtc24/placeholders
version: 0.1.0
title: 'CEN-CENELEC JTC 24 standards: placeholders'
description: 'One placeholder for each of the eight European standards of CEN/CLC/JTC 24 on the digital product
  passport. Each entry holds bibliographic data only: the number, the year, and the public title from the CEN
  catalogue. The use of a harmonised standard is voluntary. This pack does not describe the content of any standard.'
legal_as_of: '2026-10-13'
scope_statement: These entries are placeholders. No clause of any standard is mapped, and no entry has a paraphrase,
  an interpretation, or a test. This pack is not coverage of any standard. A human who holds a lawful copy must
  write and approve an interpretation before an entry can be assessed.
