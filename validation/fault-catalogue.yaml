# Fault catalogue for method validation.
#
# Audience: assessors and contributors.
# Purpose: state which seeded fault each check must detect and how.
#
# The expected outcomes of version 0.1.0 were written on 2026-10-13, before the checks were
# implemented. Version 0.2.0 adds E-13. Its commit follows the commits that add the check
# manual.review and the verifier dimension manual_results.
# Version 0.3.0 adds F-21 to F-26 and F-30 to F-34. In the git history, each entry commit comes
# before the commit that seeds its fault, with one exception:
# - F-21 to F-26: the entry commit comes before the commit that adds the four fault flags to the
#   reference system.
# - F-30 to F-33: the entry commit comes before the commit that adds the QR fixtures of F-30 and
#   F-31 and their rig setup, and before the commit that adds the flags of F-32 and F-33.
# - F-34: the entry commit comes before the commit that adds its rig setup. The QR fixture of
#   F-34 is older than the entry. An earlier carrier fix added it.
# Version 0.4.0 changes the expected outcome of F-32 after an owner decision of 2026-10-18.
# A 5xx answer now counts like a connectivity failure, so F-32 expects inconclusive with
# TRANSPORT.SERVER_ERROR. F-32 keeps its id and moves to the boundary cases, because the step
# is no longer a failure of the system under test. Version 0.4.0 also adds F-35. The commit
# that adds F-35 and changes F-32 comes before the commit that adds the flag resolver_divergent
# and before the commit that changes the 5xx outcome in the adapters.
# Version 0.5.0 adds E-14 and E-15. Their entry commit comes before the commits that add the
# status list, the attestation version 2, and the dimension signers.
# Version 0.6.0 adds the boundary cases B-10 and B-11. Their entry commit comes before the commit
# that adds the linkset and JWS JSON guards to the adapters. It also comes before the commit that
# adds the flags resolver_linkset_as_passport and signed_jws_json to the reference system.
# Version 0.7.0 adds the family controls C-FAMILY-WEB, C-FAMILY-GS1, C-FAMILY-VC, and
# C-FAMILY-AAS, and the optional per-case field profiles. It also adds the faults F-40 to F-43,
# F-48 to F-52, F-54, and F-55, and the boundary cases B-12, B-14, and F-44 to F-47. F-53 is not
# used. The git history gives this order:
# - C-FAMILY-*: the entry commit comes before the commit that runs family profiles in the rig.
# - F-40, F-41, and B-12: the entry commit comes before the commits that add their test purposes,
#   the form gs1-dl, the check identifier.granularity, their QR fixtures, and their rig setup.
# - F-42 to F-47: their checks are older than the entry commit. The entry commit comes before the
#   commit that adds the QR fixture of F-42 and the rig setup of F-45 to F-47.
# - F-43 and F-44: their flags are older than the entry commit.
# - F-45: its QR fixture is older than the entry commit.
# - F-48 to F-52 and B-14: the entry commit comes before the commit that adds the resolver checks.
#   It also comes before the commit that adds the resolver flags to the reference system.
# - F-54 and F-55: the entry commit comes before the commit that adds the lifecycle field maps.
#   It also comes before the commit that adds their flags to the reference system.
# Version 0.8.0 adds the faults F-56 to F-66 and the boundary cases B-15 and B-16. F-66 holds the
# fault aas_dpp_element_missing. B-16 is on TP-AAS-XML-001, not on TP-AAS-JSON-001. A JSON sample
# names no metamodel version, so only the XML namespace gate gives AAS.VERSION.UNSUPPORTED from a
# sample. Version 0.8.0 also changes the description of C-FAMILY-AAS, which now names the sample
# fixtures/aas/TEST-ONLY-dpp-valid.json. The git history gives this order:
# - F-56 to F-60: the entry commit comes before the commit that adds the check integrity.jose, its
#   test purpose, and the credential of the reference system. It also comes before the commit that
#   adds the five flags.
# - F-61, F-62, and B-15: the entry commit comes before the commit that adds the test purpose. It
#   also comes before the commit that adds the check identity.did and the commit that adds the flags.
# - F-63: its check aas.validate and its sample fixtures/aas/environment-invalid.json are older than
#   the entry commit. The entry commit comes before the commit that adds its rig setup.
# - F-64: its sample fixtures/aas/environment-valid.json is older than the entry commit. The entry
#   commit comes before the commit that adds the check aas.dpp_compose and before its rig setup.
# - F-65 and F-66: the entry commit comes before the commit that adds the check aas.dpp_compose and
#   their samples. It also comes before the commit that adds their rig setup.
# - B-16: its sample fixtures/aas/environment-v3-1.xml and the namespace gate of aas.validate are
#   older than the entry commit. The entry commit comes before the commit that adds its rig setup.
# - C-FAMILY-AAS: the entry commit names its new sample before the commit that adds that file. The
#   rig uses the file from the later rig setup commit on.
# The AAS commits from the one that names the template on were rewritten before they landed, to
# remove a vendored file. The entry commit and the commit after it kept their hashes. The order
# did not change.
# Version 0.9.0 adds the faults F-67 to F-70 and the boundary cases B-17 and B-18. Version 0.9.0
# also changes the descriptions of C-FAMILY-GS1 and C-FAMILY-VC, which now name their samples in
# fixtures/reference/samples/. The git history gives this order:
# - F-67, F-68, and B-17: the entry commit comes before the commit that adds the check
#   identifier.equivalence and the parameter sources of identifier.consistency. It also comes
#   before the commit that adds their test purposes, their samples, and their rig setup.
# - F-69, F-70, and B-18: the entry commit comes before the commit that adds the test purpose. It
#   also comes before the commit that adds the check integrity.status_list and the commit that adds
#   the three flags.
# - C-FAMILY-GS1 and C-FAMILY-VC: their samples and rig setup come after the entry commit of F-67.
#   The description change comes after the merge of the three packages of version 0.9.0.
# A fault counts as detected only if the named test purpose gives the expected verdict
# with the expected reason code. A crash of the runner is not a detection.
#
# All faults are synthetic and are seeded into the local reference system or into copies of
# its outputs. The reference system is an example. It is not a normative authority.
schema_version: dppce.faultcatalogue/1
version: 0.9.0
profiles: [battery/ev, battery/lmt, battery/industrial]

controls:
  - id: C-BASELINE
    description: The unmodified reference system for each battery profile.
    expected: Every executed test purpose of the illustrative pack gives `pass`.
  - id: C-EVIDENCE
    description: An unmodified signed envelope, verified with the test trust bundle.
    expected: Every mandatory verification dimension gives `pass`.
  # A family control runs the shipped example ICS and IXIT of its family profile.
  - id: C-FAMILY-WEB
    profile: family/web
    description: The unmodified reference system for the family profile family/web.
    expected: Every executed test purpose of the profile gives `pass`.
  - id: C-FAMILY-GS1
    profile: family/gs1-resolver
    description: The unmodified reference system for the family profile family/gs1-resolver, with the declared identifier sample fixtures/reference/samples/TEST-ONLY-gs1-declared.json.
    expected: Every executed test purpose of the profile gives `pass`.
  - id: C-FAMILY-VC
    profile: family/credentials
    description: The unmodified reference system for the family profile family/credentials, with the unsigned credential sample fixtures/reference/samples/TEST-ONLY-vc-subject.json.
    expected: Every executed test purpose of the profile gives `pass`.
  - id: C-FAMILY-AAS
    profile: family/aas
    description: The synthetic AAS file fixtures/aas/TEST-ONLY-dpp-valid.json for the family profile family/aas. It holds a DPP metadata submodel of the pinned IDTA 02099-1 template.
    expected: Every executed test purpose of the profile gives `pass`.

# Faults in the system under test. `fault` is the flag that the reference system accepts.
# `profiles` is optional: the full profile ids that the case runs under. Without it, the case
# runs under the catalogue-level `profiles`. Each listed profile must plan the test purpose.
# A boundary case runs once, under its first profile, unless its rig setup names a profile.
sut_faults:
  - id: F-01
    class: contract_violation
    fault: api_wrong_content_type
    description: The passport endpoint answers with media type text/plain.
    test_purpose: TP-API-001
    expected: {verdict: fail, reason_code: API.CONTRACT.CONTENT_TYPE}
  - id: F-02
    class: contract_violation
    fault: api_schema_violation
    description: The passport response omits a property that the pinned contract requires.
    test_purpose: TP-API-001
    expected: {verdict: fail, reason_code: API.CONTRACT.SCHEMA}
  - id: F-03
    class: restricted_field_leakage
    fault: leak_fetch
    description: The anonymous fetch response holds a synthetic canary in a restricted field.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.LEAK.FETCH}
  - id: F-04
    class: restricted_field_leakage
    fault: leak_export
    description: The anonymous export channel holds the canary.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.LEAK.EXPORT}
  - id: F-05
    class: restricted_field_leakage
    fault: leak_error
    description: An error response to the anonymous role echoes the canary.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.LEAK.ERROR}
  - id: F-06
    class: restricted_field_leakage
    fault: leak_html
    description: The HTML view for the anonymous role holds the canary.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.LEAK.HTML}
  - id: F-07
    class: invalid_signature
    fault: sig_invalid
    description: The signed passport payload was changed after it was signed.
    test_purpose: TP-INTEGRITY-001
    expected: {verdict: fail, reason_code: INTEGRITY.SIGNATURE.INVALID}
  - id: F-08
    class: untrusted_issuer
    fault: sig_untrusted_issuer
    description: The signature verifies, but the signing key is not in the trust bundle.
    test_purpose: TP-INTEGRITY-001
    expected: {verdict: fail, reason_code: INTEGRITY.ISSUER.UNTRUSTED}
  - id: F-09
    class: certificate_expiry
    fault: cert_expired
    description: The signer certificate expired before the evaluation time.
    test_purpose: TP-INTEGRITY-001
    expected: {verdict: fail, reason_code: INTEGRITY.CERT.EXPIRED}
  - id: F-10
    class: identity_mismatch
    fault: id_mismatch
    description: The passport states a different identifier than the carrier.
    test_purpose: TP-ID-003
    expected: {verdict: fail, reason_code: IDENTIFIER.MISMATCH}
  - id: F-11
    class: unresolved_identifier
    fault: resolver_404
    description: The resolver answers 404 for the carrier identifier.
    test_purpose: TP-ID-002
    expected: {verdict: fail, reason_code: IDENTIFIER.UNRESOLVED}
  - id: F-12
    class: schema_fault
    fault: data_wrong_type
    description: An item-level field has the wrong JSON type.
    test_purpose: TP-DATA-001
    expected: {verdict: fail, reason_code: DATA.SCHEMA.INVALID}
  - id: F-13
    class: schema_fault
    fault: data_missing_required
    description: A field that the rule pack requires for this category and tier is absent.
    test_purpose: TP-DATA-004
    expected: {verdict: fail, reason_code: DATA.COMPLETENESS.MISSING}
  - id: F-14
    class: stale_value
    fault: data_stale
    description: The last-update time is older than the freshness rule permits.
    test_purpose: TP-DATA-004
    expected: {verdict: fail, reason_code: DATA.FRESHNESS.STALE}
  - id: F-15
    class: unit_fault
    fault: data_wrong_unit
    description: A quantity uses a unit that the rule pack does not permit.
    test_purpose: TP-DATA-004
    expected: {verdict: fail, reason_code: DATA.UNIT.INVALID}
  - id: F-16
    class: relationship_fault
    fault: data_relationship
    description: The remaining capacity is larger than the rated capacity.
    test_purpose: TP-DATA-004
    expected: {verdict: fail, reason_code: DATA.RELATIONSHIP.VIOLATED}
  - id: F-17
    class: invalid_context
    fault: context_invalid
    description: The document names a JSON-LD context that is not in the pinned allowlist.
    test_purpose: TP-DATA-003
    expected: {verdict: fail, reason_code: DATA.CONTEXT.NOT_ALLOWED}
  - id: F-18
    class: registry_inconsistency
    fault: registry_inconsistent
    description: The mock registry record names a different operator than the passport.
    test_purpose: TP-REGISTRY-001
    expected: {verdict: fail, reason_code: REGISTRY.INCONSISTENT}
  - id: F-19
    class: undeclared_change
    fault: version_undeclared_change
    description: Content changed between two observations without a new version number.
    test_purpose: TP-PERSIST-001
    expected: {verdict: fail, reason_code: PERSISTENCE.UNDECLARED_CHANGE}
  - id: F-20
    class: carrier_fault
    fault: qr_payload_invalid
    description: The QR image decodes to text that is not an HTTPS or HTTP URL.
    test_purpose: TP-ID-001
    expected: {verdict: fail, reason_code: IDENTIFIER.SYNTAX.INVALID}
  - id: F-21
    class: over_restriction
    fault: over_restrict_legitimate_interest
    description: The passport for the legitimate_interest role omits a field that the declared policy gives to that role.
    test_purpose: TP-ACCESS-002
    expected: {verdict: fail, reason_code: ACCESS.ENTITLEMENT.MISSING}
  - id: F-22
    class: restricted_field_leakage
    fault: leak_supplier_to_legitimate_interest
    description: The passport for the legitimate_interest role holds a field that the declared policy gives to the authority role only.
    test_purpose: TP-ACCESS-002
    expected: {verdict: fail, reason_code: ACCESS.LEAK.FETCH}
  - id: F-23
    class: restricted_field_leakage
    fault: leak_usage_log_anonymous
    description: The anonymous passport holds a synthetic withheld field that stands in for a non-public item.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.LEAK.FETCH}
  - id: F-24
    class: over_restriction
    fault: deny_all
    description: The system answers 403 to every request. The anonymous role does not get the public fields of the declared policy.
    test_purpose: TP-ACCESS-001
    expected: {verdict: fail, reason_code: ACCESS.ENTITLEMENT.REFUSED}
  - id: F-25
    class: over_restriction
    fault: deny_all
    description: The system answers 403 to every request. The legitimate_interest role does not get its fields.
    test_purpose: TP-ACCESS-002
    expected: {verdict: fail, reason_code: ACCESS.ENTITLEMENT.REFUSED}
  - id: F-26
    class: over_restriction
    fault: deny_all
    description: The system answers 403 to every request. The authority role does not get its fields.
    test_purpose: TP-ACCESS-003
    expected: {verdict: fail, reason_code: ACCESS.ENTITLEMENT.REFUSED}
  - id: F-30
    class: carrier_fault
    fault: qr_wrong_shape
    description: The QR image encodes a GS1 Digital Link URI whose GTIN has 13 digits.
    test_purpose: TP-ID-001
    expected: {verdict: fail, reason_code: IDENTIFIER.SYNTAX.INVALID}
  - id: F-31
    class: carrier_fault
    fault: qr_non_ascii_digits
    description: The QR image encodes the GTIN in Arabic-Indic digits.
    test_purpose: TP-ID-001
    expected: {verdict: fail, reason_code: IDENTIFIER.SYNTAX.INVALID}
  - id: F-33
    class: unresolved_identifier
    fault: resolver_html
    description: The resolver answers 200 with an HTML page instead of a passport.
    test_purpose: TP-ID-002
    expected: {verdict: fail, reason_code: IDENTIFIER.RESPONSE.NOT_JSON}
  - id: F-34
    class: carrier_fault
    fault: qr_two_symbols
    description: The QR image holds two readable QR symbols.
    test_purpose: TP-CARRIER-001
    expected: {verdict: fail, reason_code: CARRIER.QR.NOT_DECODED}
  - id: F-35
    class: binding_divergence
    fault: resolver_divergent
    description: The resolver path answers 200 with a passport that has the carrier identifier but differs from the passport at the API item target.
    test_purpose: TP-ID-003
    expected: {verdict: fail, reason_code: IDENTIFIER.BINDING.MISMATCH}
  - id: F-40
    class: carrier_fault
    fault: qr_qualifier_order
    description: The QR payload is a GS1 Digital Link URI with the serial before the lot.
    test_purpose: TP-GS1-SYNTAX-002
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: IDENTIFIER.SYNTAX.INVALID}
  - id: F-41
    class: carrier_fault
    fault: qr_model_level
    description: The QR payload is a GTIN-only GS1 Digital Link URI, and the ICS declares item granularity.
    test_purpose: TP-GS1-GRANULARITY-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: IDENTIFIER.GRANULARITY.MISMATCH}
  - id: F-42
    class: carrier_fault
    fault: qr_http_scheme
    description: The QR payload is a valid GS1 Digital Link URI with the http scheme.
    test_purpose: TP-ID-001
    expected: {verdict: fail, reason_code: IDENTIFIER.SCHEME.NOT_HTTPS}
  - id: F-43
    class: unresolved_identifier
    fault: deny_all
    description: The system answers 403 to every request, also to the resolver path of the carrier identifier.
    test_purpose: TP-ID-002
    expected: {verdict: fail, reason_code: IDENTIFIER.RESOLUTION.STATUS}
  - id: F-48
    class: contract_violation
    fault: resolver_linkset_invalid
    description: The linkset answer has the linkset media type, but its linkset member is not a list of link context objects.
    test_purpose: TP-GS1-LINKSET-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: RESOLVER.LINKSET.STRUCTURE}
  - id: F-49
    class: contract_violation
    fault: resolver_linkset_no_dpp
    description: The linkset has no link with the declared passport relation.
    test_purpose: TP-GS1-LINKSET-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: RESOLVER.LINKSET.RELATION_MISSING}
  - id: F-50
    class: contract_violation
    fault: resolver_linkset_anchor_mismatch
    description: The anchor of the linkset is a different identifier.
    test_purpose: TP-GS1-LINKSET-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: RESOLVER.LINKSET.ANCHOR}
  - id: F-51
    class: contract_violation
    fault: wellknown_wrong_root
    description: The resolver description file names a different resolverRoot.
    test_purpose: TP-GS1-WELLKNOWN-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: RESOLVER.WELLKNOWN.ROOT}
  - id: F-52
    class: contract_violation
    fault: resolver_200_for_invalid
    description: The resolver answers 200 for a GS1 path with a wrong GTIN check digit.
    test_purpose: TP-GS1-CONFORMANCE-001
    profiles: [family/gs1-resolver]
    expected: {verdict: fail, reason_code: RESOLVER.CONFORMANCE.INVALID_ACCEPTED}
  - id: F-54
    class: registry_inconsistency
    fault: registry_extra_field_differs
    description: The registry record and the passport differ in a third declared field pair.
    test_purpose: TP-REGISTRY-002
    expected: {verdict: fail, reason_code: REGISTRY.INCONSISTENT}
  - id: F-55
    class: undeclared_change
    fault: version_raw_digest_stale
    description: The last raw-byte digest of the history is not the digest of the current item body.
    test_purpose: TP-PERSIST-002
    expected: {verdict: fail, reason_code: PERSISTENCE.UNDECLARED_CHANGE}
  - id: F-56
    class: invalid_signature
    fault: vc_tampered
    description: The payload of the VC-JOSE credential changes after signing.
    test_purpose: TP-VC-JOSE-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: INTEGRITY.JOSE.SIGNATURE}
  - id: F-57
    class: invalid_signature
    fault: vc_hs256_confusion
    description: The credential header names HS256, and the credential is MACed with the bytes of the issuer public key.
    test_purpose: TP-VC-JOSE-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: INTEGRITY.JOSE.ALGORITHM}
  - id: F-58
    class: certificate_expiry
    fault: vc_expired
    description: The validUntil of the validly signed credential is before the evaluation time.
    test_purpose: TP-VC-JOSE-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: INTEGRITY.JOSE.EXPIRED}
  - id: F-59
    class: untrusted_issuer
    fault: vc_untrusted_kid
    description: The kid of the credential names no passport key of the trust bundle.
    test_purpose: TP-VC-JOSE-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: INTEGRITY.JOSE.ISSUER_UNTRUSTED}
  - id: F-60
    class: invalid_signature
    fault: vc_alg_none
    description: The credential is an unsecured JWS with the algorithm none and an empty signature.
    test_purpose: TP-VC-JOSE-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: INTEGRITY.JOSE.ALGORITHM}
  - id: F-61
    class: identity_mismatch
    fault: did_id_mismatch
    description: The id of the DID document is a different DID.
    test_purpose: TP-VC-DID-001
    profiles: [family/credentials]
    expected: {verdict: fail, reason_code: IDENTITY.DID.ID_MISMATCH}
  - id: F-62
    class: contract_violation
    fault: did_private_key
