# Status: runs on the private repository since 2026-10-15. See docs/readiness.md.
# Every action is pinned to a commit. The comment gives the release that the commit belongs to.
name: scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    # On a private repository Scorecard needs a personal access token for its GraphQL queries;
    # the GITHUB_TOKEN gets 'Resource not accessible by integration'. The job runs once the
    # repository is public. The owner can add a token secret instead; no agent creates one.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # A job-level list replaces read-all: a private repository needs contents read to check out.
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # The OpenSSF API takes results of public repositories only.
          publish_results: ${{ !github.event.repository.private }}
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
