# Status: first run on tag v0.1.0rc1, 2026-10-15 (run 38722322047): all jobs passed.
# See docs/readiness.md.
# Every action is pinned to a commit. The comment gives the release that the commit belongs to.
#
# It builds the packages and the container image, writes a CycloneDX SBOM, and creates signed
# build provenance. A gate job checks the tag, the version, the ci result, and the protection of
# the `release` environment. The attest and image jobs run in the `release` environment. Before
# the push, a scan job with read permission only scans a build of the same commit with Trivy
# 0.75.0. The pushed image is a separate build of that commit. The attest and image jobs wait
# for the scan job. See GOVERNANCE.md.
# The gate job, the scan job, and the environment were added on 2026-10-18. They have not run.
#
# The build job has read permission only, and every tool that it runs is pinned with hashes in
# uv.lock. The scan job has read permission only. The attest job runs only the attestation
# action. The image job can sign: it runs the pinned Docker actions and the attestation action.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Each check fails closed: `! [ "$n" -ge 1 ]` is also true when n is not a number.
  # Values reach the shell through env, never through `${{ }}` in run.
  gate:
    name: Tag, version, ci result, and release environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The run is for a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::RELEASE.TAG.NOT_TAG: a release runs for a tag only"
            exit 1
          fi
      - name: The tag equals v plus the pyproject version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::RELEASE.TAG.VERSION_MISMATCH: the tag is not v$version"
            exit 1
          fi
      # Only a commit whose own ci push run on main finished green can be released.
      - name: The ci workflow passed for the tagged commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success" --jq .total_count) || ! [ "$n" -ge 1 ]; then
            echo "::error::RELEASE.CI.NOT_PASSED: rerun or wait for the ci run of this commit on main, then rerun this workflow"
            exit 1
          fi
      # GitHub creates an environment with no rules the first time a job names it. Without this
      # check, the approval would gate nothing.
      - name: The release environment has a required reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! n=$(gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '[.protection_rules[]? | select(.type=="required_reviewers")] | length') || ! [ "$n" -ge 1 ]; then
            echo "::error::RELEASE.ENVIRONMENT.UNPROTECTED: the release environment is missing or has no required reviewer"
            exit 1
          fi

  # No write and no OIDC permission: the Trivy binary and the scan build cannot push or sign.
  scan:
    name: Container image vulnerability scan
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          provenance: false
          sbom: false
          tags: dppce-scan:${{ github.sha }}
      - name: Install Trivy 0.75.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/trivy.tgz" https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          echo "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  $RUNNER_TEMP/trivy.tgz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
      # Trivy downloads its vulnerability database at run time.
      - name: High and critical findings with a fix stop the release
        run: '"$RUNNER_TEMP/trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress "dppce-scan:$GITHUB_SHA"'

  build:
    name: Build packages and SBOM (no signing permission)
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.9.24"
      # The SBOM tool comes from the `release` group of uv.lock. Nothing is installed unpinned.
      - name: Install from the lockfile
        run: uv sync --frozen --all-extras --group release
      - name: Build the sdist and the wheel
        run: uv build
      - name: CycloneDX SBOM of the locked environment
        run: uv run --no-sync cyclonedx-py environment .venv --output-format JSON --output-file dist/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  attest:
    name: Signed build provenance for the packages
    # The scan gates the package provenance too, so a failed scan never asks for an approval.
    needs: [build, scan]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json

  image:
    name: Container image with signed provenance
    needs: [gate, scan]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # ponytail: this push is a rebuild of the same commit, not the bytes that the scan job
      # scanned. readiness.md records a byte-identical rebuild of the pinned Dockerfile. Pushing
      # the scanned bytes needs an OCI-layout push tool (crane, skopeo, oras), not added here.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
      - name: Signed build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
