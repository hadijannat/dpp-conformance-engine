# Vale configuration. Status: written, not run. The `vale` binary was not available in the
# development session (OQ-005, BL-002). The rules in styles/STE are project-authored heuristics.
# They do not contain text, rules, or the dictionary of ASD-STE100.
StylesPath = styles
MinAlertLevel = suggestion
Vocab = dppce

[*.md]
BasedOnStyles = STE
# Code, identifiers, and quoted legal citations are not prose to restyle.
TokenIgnores = (`[^`]+`), (\bArt\. ?\d+[^,.;]*), (\bAnnex [IVXLC]+[^,.;]*), (\bRegulation \(EU\) \d{4}/\d+)
BlockIgnores = (?s)(```.*?```)

# Generated pages, licenses, raw research, and approved or third-party text are not checked.
[docs/reference/{cli,capabilities,schemas,dependency-licenses,verdict-truth-table}.md]
BasedOnStyles =

[{LICENSES,docs/research/raw,catalogue,CHANGELOG.md}/**]
BasedOnStyles =
