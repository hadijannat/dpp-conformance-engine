<svg xmlns="http://www.w3.org/2000/svg" width="880" height="708" viewBox="0 0 880 708" role="img" aria-labelledby="title desc">
<title id="title">What the engine checks</title>
<desc id="desc">Seven independent test areas: data carrier, identifier, interface, data, access, integrity, and lifecycle. Checks depend on the selected profile and catalogue. Registry checks use a mock. Passport signatures are distinct from report signatures.</desc>
<defs><marker id="arrow-67e8db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#67e8db"/></marker><marker id="arrow-93c5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#93c5fd"/></marker><marker id="arrow-86efc0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#86efc0"/></marker><marker id="arrow-fda4af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fda4af"/></marker><marker id="arrow-fcd884" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fcd884"/></marker><marker id="arrow-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c4b5fd"/></marker><marker id="arrow-bdcfe1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bdcfe1"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="708" rx="24" fill="#0d1d32" stroke="#0d1d32" stroke-width="1.5"/>
<text x="32" y="37" font-size="14" fill="#67e8db" font-weight="600" text-anchor="start">DPP-CE / TEST SCOPE</text>
<text x="32" y="80" font-size="30" fill="#f4f8ff" font-weight="700" text-anchor="start">What the engine checks</text>
<text x="32" y="110" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Seven areas. Coverage follows your selected profile.</text>
<rect x="32" y="140" width="264" height="146" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="52" y="169" font-size="15" fill="#67e8db" font-weight="700" text-anchor="start">01</text>
<text x="52" y="205" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Data carrier</text>
<text x="52" y="236" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">A supplied QR image</text>
<text x="52" y="261" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">decodes to one symbol.</text>
<rect x="308" y="140" width="264" height="146" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="328" y="169" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="start">02</text>
<text x="328" y="205" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Identifier</text>
<text x="328" y="236" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Syntax, resolution,</text>
<text x="328" y="261" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">and consistent identity.</text>
<rect x="584" y="140" width="264" height="146" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="604" y="169" font-size="15" fill="#c4b5fd" font-weight="700" text-anchor="start">03</text>
<text x="604" y="205" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Interface</text>
<text x="604" y="236" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Responses match a</text>
<text x="604" y="261" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">pinned API contract.</text>
<rect x="32" y="306" width="404" height="140" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="52" y="335" font-size="15" fill="#93c5fd" font-weight="700" text-anchor="start">04</text>
<text x="52" y="371" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Data</text>
<text x="52" y="402" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Pinned schemas, contexts,</text>
<text x="52" y="427" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">and rule packs.</text>
<rect x="452" y="306" width="396" height="140" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="472" y="335" font-size="15" fill="#67e8db" font-weight="700" text-anchor="start">05</text>
<text x="472" y="371" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Access</text>
<text x="472" y="402" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Roles receive only the fields</text>
<text x="472" y="427" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">their declared policy allows.</text>
<rect x="32" y="466" width="404" height="140" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="52" y="495" font-size="15" fill="#c4b5fd" font-weight="700" text-anchor="start">06</text>
<text x="52" y="531" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Integrity</text>
<text x="52" y="562" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Passport signatures, issuers,</text>
<text x="52" y="587" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">and X.509 certificate paths.</text>
<rect x="452" y="466" width="396" height="140" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="472" y="495" font-size="15" fill="#fcd884" font-weight="700" text-anchor="start">07</text>
<text x="472" y="531" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Lifecycle</text>
<text x="472" y="562" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Version history and update rules;</text>
<text x="472" y="587" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">agreement with a mock registry.</text>
<text x="32" y="650" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Checks cover the selected catalogue only.</text>
<text x="32" y="677" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Unavailable checks cannot pass. Registry integration is mock-only.</text>
</g>
</svg>
