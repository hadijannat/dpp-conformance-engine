<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <rect x="0.5" y="0.5" width="879" height="359" rx="12" fill="#ffffff" stroke="#767676" stroke-width="1" />
  <title id="title">Parts of a DPP system that the engine observes</title>
  <desc id="desc">Seven areas the engine observes in a passport system: data carrier, identifier, interface, data, access, integrity, and lifecycle, each with what its checks look at.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#767676" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
    <text x="24" y="38" font-size="18" fill="#1a1a1a" font-weight="600">Parts of a DPP system that the engine observes</text>
    <path d="M 214 140 H 238" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="decode" />
    <text x="226.0" y="80" font-size="12" fill="#4a4a4a" text-anchor="middle">decode</text>
    <path d="M 428 140 H 452" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="resolve" />
    <text x="440.0" y="80" font-size="12" fill="#4a4a4a" text-anchor="middle">resolve</text>
    <path d="M 642 140 H 666" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="fetch" />
    <text x="654.0" y="80" font-size="12" fill="#4a4a4a" text-anchor="middle">fetch</text>
    <path d="M 761 190 V 218 H 119 V 236" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="checks on passport data" />
    <path d="M 440 218 V 236" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="checks on passport data" />
    <path d="M 728 218 V 236" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="checks on passport data" />
    <text x="440" y="211" font-size="12" fill="#4a4a4a" text-anchor="middle">checks on passport data</text>
    <rect x="24" y="90" width="190" height="100" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="38" y="114" font-size="14" fill="#1a1a1a" font-weight="600">Data carrier</text>
    <text x="38" y="145" font-size="12" fill="#1a1a1a">
      <tspan x="38" dy="0">a QR image decodes</tspan>
      <tspan x="38" dy="17">to one symbol</tspan>
    </text>
    <rect x="238" y="90" width="190" height="100" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="252" y="114" font-size="14" fill="#1a1a1a" font-weight="600">Identifier</text>
    <text x="252" y="145" font-size="12" fill="#1a1a1a">
      <tspan x="252" dy="0">declared syntax, resolves,</tspan>
      <tspan x="252" dy="17">same everywhere</tspan>
    </text>
    <rect x="452" y="90" width="190" height="100" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="466" y="114" font-size="14" fill="#1a1a1a" font-weight="600">Interface</text>
    <text x="466" y="145" font-size="12" fill="#1a1a1a">
      <tspan x="466" dy="0">response matches the</tspan>
      <tspan x="466" dy="17">pinned API contract</tspan>
    </text>
    <rect x="666" y="90" width="190" height="100" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="680" y="114" font-size="14" fill="#1a1a1a" font-weight="600">Data</text>
    <text x="680" y="145" font-size="12" fill="#1a1a1a">
      <tspan x="680" dy="0">pinned schema, context</tspan>
      <tspan x="680" dy="17">allowlist, rule pack</tspan>
    </text>
    <path d="M 180 98 H 201 L 207 104 V 121 H 180 Z" fill="#ffffff" stroke="#767676" />
    <circle cx="202" cy="104" r="1.4" fill="#767676" />
    <path d="M 184 102 H 190 V 108 H 184 Z M 193 102 H 197 V 106 H 193 Z M 184 111 H 188 V 117 H 184 Z M 192 111 H 195 V 114 H 199 V 118 H 196 V 116 H 192 Z" fill="#1a1a1a" />
    <rect x="24" y="236" width="256" height="77" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="38" y="258" font-size="14" fill="#1a1a1a" font-weight="600">Access</text>
    <text x="38" y="274" font-size="12" fill="#1a1a1a">a role gets no withheld field</text>
    <rect x="312" y="236" width="256" height="77" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="326" y="258" font-size="14" fill="#1a1a1a" font-weight="600">Integrity</text>
    <text x="326" y="274" font-size="12" fill="#1a1a1a">
      <tspan x="326" dy="0">valid signature, trusted issuer,</tspan>
      <tspan x="326" dy="14">valid issuer key</tspan>
    </text>
    <rect x="600" y="236" width="256" height="77" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="614" y="258" font-size="14" fill="#1a1a1a" font-weight="600">Lifecycle</text>
    <text x="614" y="274" font-size="12" fill="#1a1a1a">
      <tspan x="614" dy="0">version history follows the</tspan>
      <tspan x="614" dy="14">update rule; a mock registry</tspan>
      <tspan x="614" dy="14">record agrees</tspan>
    </text>
    <text x="24" y="333" font-size="12" fill="#4a4a4a">Checks are deterministic code. Results cover the selected catalogue only.</text>
  </g>
</svg>
