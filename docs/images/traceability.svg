<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="title desc">
  <rect x="0.5" y="0.5" width="879" height="499" rx="12" fill="#ffffff" stroke="#767676" stroke-width="1" />
  <title id="title">From a source to a verdict</title>
  <desc id="desc">Traceability: a requirement cites a source record, holds its interpretation and applicability rule, and names test purposes and checks. Step verdicts roll up to the overall outcome, and observations link to encrypted records.</desc>
