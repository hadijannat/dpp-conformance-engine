<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1472" viewBox="0 0 400 1472" role="img" aria-labelledby="title desc">
<title id="title">Five verdicts, with a bounded overall outcome</title>
<desc id="desc">Five verdicts use words and symbols as well as color. The overall outcome uses applicable mandatory requirements only, with fail, then error, then inconclusive, then pass. Empty scope is inconclusive. At requirement level, a valid fail wins; otherwise a passing alternative can establish pass despite another path error. Unknown applicability is inconclusive and counted separately.</desc>
<defs><marker id="arrow-67e8db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#67e8db"/></marker><marker id="arrow-93c5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#93c5fd"/></marker><marker id="arrow-86efc0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#86efc0"/></marker><marker id="arrow-fda4af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fda4af"/></marker><marker id="arrow-fcd884" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fcd884"/></marker><marker id="arrow-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c4b5fd"/></marker><marker id="arrow-bdcfe1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bdcfe1"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="400" height="1472" rx="24" fill="#0d1d32" stroke="#0d1d32" stroke-width="1.5"/>
<text x="32" y="37" font-size="13" fill="#67e8db" font-weight="600" text-anchor="start">DPP-CE / VERDICTS</text>
<text x="32" y="80" font-size="26" fill="#f4f8ff" font-weight="700" text-anchor="start">Read the result</text>
<text x="32" y="110" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Five verdicts, with explicit limits.</text>
<rect x="32" y="140" width="336" height="120" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="60" cy="173" r="16" fill="#152d49" stroke="#86efc0" stroke-width="1.5"/>
<text x="60" y="181" font-size="23" fill="#86efc0" font-weight="700" text-anchor="middle">✓</text>
<text x="87" y="181" font-size="21" fill="#f4f8ff" font-weight="700" text-anchor="start">pass</text>
<text x="48" y="218" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">A path passed; no valid</text>
<text x="48" y="242" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">observation failed.</text>
<rect x="32" y="276" width="336" height="120" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="60" cy="309" r="16" fill="#152d49" stroke="#fda4af" stroke-width="1.5"/>
<text x="60" y="317" font-size="23" fill="#fda4af" font-weight="700" text-anchor="middle">×</text>
<text x="87" y="317" font-size="21" fill="#f4f8ff" font-weight="700" text-anchor="start">fail</text>
<text x="48" y="354" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">A valid observation or declaration</text>
<text x="48" y="378" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">contradicts the requirement.</text>
<rect x="32" y="412" width="336" height="120" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="60" cy="445" r="16" fill="#152d49" stroke="#fcd884" stroke-width="1.5"/>
<text x="60" y="453" font-size="23" fill="#fcd884" font-weight="700" text-anchor="middle">?</text>
<text x="87" y="453" font-size="21" fill="#f4f8ff" font-weight="700" text-anchor="start">inconclusive</text>
<text x="48" y="490" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Evidence is missing or insufficient,</text>
<text x="48" y="514" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">or applicability is unknown.</text>
<rect x="32" y="548" width="336" height="120" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="60" cy="581" r="16" fill="#152d49" stroke="#93c5fd" stroke-width="1.5"/>
<text x="60" y="589" font-size="23" fill="#93c5fd" font-weight="700" text-anchor="middle">–</text>
<text x="87" y="589" font-size="21" fill="#f4f8ff" font-weight="700" text-anchor="start">not_applicable</text>
<text x="48" y="626" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Applicability is established</text>
<text x="48" y="650" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">as false.</text>
<rect x="32" y="684" width="336" height="120" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="60" cy="717" r="16" fill="#152d49" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="60" y="725" font-size="23" fill="#c4b5fd" font-weight="700" text-anchor="middle">!</text>
<text x="87" y="725" font-size="21" fill="#f4f8ff" font-weight="700" text-anchor="start">error</text>
<text x="48" y="762" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Execution prevented an outcome;</text>
<text x="48" y="786" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">no other path passed or failed.</text>
<rect x="32" y="832" width="336" height="346" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="48" y="870" font-size="23" fill="#f4f8ff" font-weight="700" text-anchor="start">Overall outcome</text>
<text x="48" y="900" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Applicable mandatory</text>
<text x="48" y="925" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">requirements only.</text>
<text x="48" y="969" font-size="18" fill="#fcd884" font-weight="400" text-anchor="start">Empty scope → inconclusive</text>
<text x="48" y="1012" font-size="20" fill="#fda4af" font-weight="600" text-anchor="start">1   Any fail → fail</text>
<text x="48" y="1052" font-size="20" fill="#c4b5fd" font-weight="600" text-anchor="start">2   Else error → error</text>
<text x="48" y="1092" font-size="18" fill="#fcd884" font-weight="600" text-anchor="start">3   Else any inconclusive</text>
<text x="76" y="1112" font-size="17" fill="#fcd884" font-weight="400" text-anchor="start">→ inconclusive</text>
<text x="48" y="1132" font-size="20" fill="#86efc0" font-weight="600" text-anchor="start">4   Else → pass</text>
<rect x="32" y="1200" width="336" height="192" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="48" y="1236" font-size="21" fill="#67e8db" font-weight="700" text-anchor="start">At requirement level</text>
<text x="48" y="1270" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">A valid fail wins. Otherwise,</text>
<text x="48" y="1294" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">a passing alternative can satisfy</text>
<text x="48" y="1318" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">the requirement despite another</text>
<text x="48" y="1342" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">path&#x27;s error. Reviewed mode</text>
<text x="48" y="1366" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">also requires approval.</text>
<text x="32" y="1424" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Unknown applicability is</text>
<text x="32" y="1448" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">inconclusive and counted separately.</text>
</g>
</svg>
