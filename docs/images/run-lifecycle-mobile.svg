<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1808" viewBox="0 0 400 1808" role="img" aria-labelledby="title desc">
<title id="title">One run, end to end</title>
<desc id="desc">The owner supplies untrusted ICS and IXIT files. The operator controls trust, secrets, and private hosts. Plan selects checks without network contact. Run alone reaches the system through the policy-enforcing transport. The run writes reports, inputs, and encrypted records. Replay, export, and signing independently use those outputs. Replay needs the recorded inputs, recording, and data key. The recipient verifies a signed report using its own trust bundle; this does not retest the system.</desc>
<defs><marker id="arrow-67e8db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#67e8db"/></marker><marker id="arrow-93c5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#93c5fd"/></marker><marker id="arrow-86efc0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#86efc0"/></marker><marker id="arrow-fda4af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fda4af"/></marker><marker id="arrow-fcd884" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fcd884"/></marker><marker id="arrow-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c4b5fd"/></marker><marker id="arrow-bdcfe1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bdcfe1"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="400" height="1808" rx="24" fill="#0d1d32" stroke="#0d1d32" stroke-width="1.5"/>
<text x="32" y="37" font-size="14" fill="#67e8db" font-weight="600" text-anchor="start">02 / DPP-CE EXPLAINED</text>
<text x="32" y="80" font-size="26" fill="#f4f8ff" font-weight="700" text-anchor="start">One run, end to end</text>
<text x="32" y="110" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Live checks, then offline evidence.</text>
<rect x="32" y="148" width="336" height="178" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="164" width="4" height="146" rx="2" fill="#93c5fd" stroke="#93c5fd" stroke-width="1.5"/>
<text x="54" y="183" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Inputs and controls</text>
<text x="54" y="214" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Owner: ICS + IXIT declarations</text>
<text x="54" y="239" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Both files are untrusted.</text>
<text x="54" y="264" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Operator: trusted keys, secrets,</text>
<text x="54" y="289" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">and private-host confirmations.</text>
<rect x="32" y="368" width="336" height="94" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="384" width="4" height="62" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="403" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">01  Plan</text>
<text x="54" y="434" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Select checks; no system contact</text>
<rect x="32" y="504" width="336" height="106" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="520" width="4" height="74" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="539" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">02  Run</text>
<text x="54" y="570" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Acquire + evaluate</text>
<text x="54" y="595" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">All requests enforce policy</text>
<rect x="32" y="652" width="336" height="78" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="668" width="4" height="46" rx="2" fill="#fcd884" stroke="#fcd884" stroke-width="1.5"/>
<text x="54" y="687" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Policy transport</text>
<rect x="32" y="772" width="336" height="94" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="788" width="4" height="62" rx="2" fill="#fcd884" stroke="#fcd884" stroke-width="1.5"/>
<text x="54" y="807" font-size="23" fill="#f4f8ff" font-weight="700" text-anchor="start">System under test</text>
<text x="54" y="838" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Only Run contacts this system.</text>
<path d="M 200 326 L 200 368" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-93c5fd)"/>
<path d="M 200 462 L 200 504" fill="none" stroke="#67e8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-67e8db)"/>
<path d="M 200 610 L 200 652" fill="none" stroke="#fcd884" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fcd884)"/>
<path d="M 190 730 L 190 772" fill="none" stroke="#fcd884" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fcd884)"/>
<path d="M 210 772 L 210 730" fill="none" stroke="#fcd884" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-fcd884)"/>
<rect x="32" y="916" width="336" height="128" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="932" width="4" height="96" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="951" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">03  Record</text>
<text x="54" y="982" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">HTML + JSON reports</text>
<text x="54" y="1007" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Run inputs + encrypted records</text>
<text x="54" y="1032" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Captured responses are untrusted.</text>
<path d="M 368 557 L 384 557 L 384 980 L 368 980" fill="none" stroke="#67e8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-67e8db)"/>
<text x="32" y="1090" font-size="14" fill="#67e8db" font-weight="600" text-anchor="start">INDEPENDENT OFFLINE OPTIONS</text>
<rect x="32" y="1118" width="336" height="106" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="1134" width="4" height="74" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="1153" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Replay</text>
<text x="54" y="1184" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Inputs + recording + data key</text>
<text x="54" y="1209" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Reproduce the decision digest</text>
<rect x="32" y="1256" width="336" height="106" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="1272" width="4" height="74" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="1291" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Export</text>
<text x="54" y="1322" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Read the JSON report</text>
<text x="54" y="1347" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">HTML, JUnit XML, SARIF</text>
<rect x="32" y="1394" width="336" height="106" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="1410" width="4" height="74" rx="2" fill="#67e8db" stroke="#67e8db" stroke-width="1.5"/>
<text x="54" y="1429" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Sign</text>
<text x="54" y="1460" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Report + signing key</text>
<text x="54" y="1485" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Create a signed envelope</text>
<path d="M 32 980 L 16 980 L 16 1171 L 32 1171" fill="none" stroke="#67e8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-67e8db)"/>
<path d="M 16 1171 L 16 1309 L 32 1309" fill="none" stroke="#67e8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-67e8db)"/>
<path d="M 16 1309 L 16 1447 L 32 1447" fill="none" stroke="#67e8db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-67e8db)"/>
<rect x="32" y="1548" width="336" height="130" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<rect x="33" y="1564" width="4" height="98" rx="2" fill="#93c5fd" stroke="#93c5fd" stroke-width="1.5"/>
<text x="54" y="1583" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Verify</text>
<text x="54" y="1614" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Standalone report verifier</text>
<text x="54" y="1639" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Recipient&#x27;s own trust bundle</text>
<text x="54" y="1664" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Issuer keys from its own channel</text>
<path d="M 200 1500 L 200 1548" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-93c5fd)"/>
<text x="32" y="1730" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Replay and verification use</text>
<text x="32" y="1755" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">existing evidence. They do not</text>
<text x="32" y="1780" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">test the passport system again.</text>
</g>
</svg>
