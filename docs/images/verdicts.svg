<svg xmlns="http://www.w3.org/2000/svg" width="880" height="824" viewBox="0 0 880 824" role="img" aria-labelledby="title desc">
<title id="title">Five verdicts, with a bounded overall outcome</title>
<desc id="desc">Five verdicts use words and symbols as well as color. The overall outcome uses applicable mandatory requirements only, with fail, then error, then inconclusive, then pass. Empty scope is inconclusive. At requirement level, a valid fail wins; otherwise a passing alternative can establish pass despite another path error. Unknown applicability is inconclusive and counted separately.</desc>
<defs><marker id="arrow-67e8db" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#67e8db"/></marker><marker id="arrow-93c5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#93c5fd"/></marker><marker id="arrow-86efc0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#86efc0"/></marker><marker id="arrow-fda4af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fda4af"/></marker><marker id="arrow-fcd884" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#fcd884"/></marker><marker id="arrow-c4b5fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#c4b5fd"/></marker><marker id="arrow-bdcfe1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#bdcfe1"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="880" height="824" rx="24" fill="#0d1d32" stroke="#0d1d32" stroke-width="1.5"/>
<text x="32" y="37" font-size="14" fill="#67e8db" font-weight="600" text-anchor="start">DPP-CE / VERDICTS</text>
<text x="32" y="80" font-size="30" fill="#f4f8ff" font-weight="700" text-anchor="start">Understand the result</text>
<text x="32" y="110" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Five verdicts. One bounded overall outcome.</text>
<rect x="32" y="140" width="470" height="92" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="64" cy="184" r="20" fill="#152d49" stroke="#86efc0" stroke-width="1.5"/>
<text x="64" y="193" font-size="27" fill="#86efc0" font-weight="700" text-anchor="middle">✓</text>
<text x="100" y="168" font-size="22" fill="#f4f8ff" font-weight="700" text-anchor="start">pass</text>
<text x="100" y="194" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">A path passed;</text>
<text x="100" y="219" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">no valid observation failed.</text>
<rect x="32" y="240" width="470" height="92" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="64" cy="284" r="20" fill="#152d49" stroke="#fda4af" stroke-width="1.5"/>
<text x="64" y="293" font-size="27" fill="#fda4af" font-weight="700" text-anchor="middle">×</text>
<text x="100" y="268" font-size="22" fill="#f4f8ff" font-weight="700" text-anchor="start">fail</text>
<text x="100" y="294" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">A valid observation or declaration</text>
<text x="100" y="319" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">contradicts the requirement.</text>
<rect x="32" y="340" width="470" height="92" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="64" cy="384" r="20" fill="#152d49" stroke="#fcd884" stroke-width="1.5"/>
<text x="64" y="393" font-size="27" fill="#fcd884" font-weight="700" text-anchor="middle">?</text>
<text x="100" y="368" font-size="22" fill="#f4f8ff" font-weight="700" text-anchor="start">inconclusive</text>
<text x="100" y="394" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Evidence is missing or insufficient,</text>
<text x="100" y="419" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">or applicability is unknown.</text>
<rect x="32" y="440" width="470" height="92" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="64" cy="484" r="20" fill="#152d49" stroke="#93c5fd" stroke-width="1.5"/>
<text x="64" y="493" font-size="27" fill="#93c5fd" font-weight="700" text-anchor="middle">–</text>
<text x="100" y="468" font-size="22" fill="#f4f8ff" font-weight="700" text-anchor="start">not_applicable</text>
<text x="100" y="494" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Applicability is established as false.</text>
<rect x="32" y="540" width="470" height="92" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<circle cx="64" cy="584" r="20" fill="#152d49" stroke="#c4b5fd" stroke-width="1.5"/>
<text x="64" y="593" font-size="27" fill="#c4b5fd" font-weight="700" text-anchor="middle">!</text>
<text x="100" y="568" font-size="22" fill="#f4f8ff" font-weight="700" text-anchor="start">error</text>
<text x="100" y="594" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Execution prevented an outcome;</text>
<text x="100" y="619" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">no other path passed or failed.</text>
<rect x="526" y="140" width="322" height="492" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="550" y="178" font-size="24" fill="#f4f8ff" font-weight="700" text-anchor="start">Overall outcome</text>
<text x="550" y="211" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Applicable mandatory</text>
<text x="550" y="236" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">requirements only.</text>
<rect x="546" y="258" width="282" height="72" rx="12" fill="#0d1d32" stroke="#416180" stroke-width="1.5"/>
<text x="560" y="285" font-size="18" fill="#fcd884" font-weight="400" text-anchor="start">No applicable mandatory</text>
<text x="560" y="310" font-size="18" fill="#fcd884" font-weight="400" text-anchor="start">requirements? Inconclusive.</text>
<text x="550" y="370" font-size="18" fill="#fda4af" font-weight="700" text-anchor="start">1</text>
<text x="580" y="370" font-size="20" fill="#f4f8ff" font-weight="600" text-anchor="start">Any fail → fail</text>
<text x="550" y="417" font-size="18" fill="#c4b5fd" font-weight="700" text-anchor="start">2</text>
<text x="580" y="417" font-size="20" fill="#f4f8ff" font-weight="600" text-anchor="start">Else error → error</text>
<text x="550" y="464" font-size="18" fill="#fcd884" font-weight="700" text-anchor="start">3</text>
<text x="580" y="464" font-size="18" fill="#f4f8ff" font-weight="600" text-anchor="start">Else any inconclusive</text>
<text x="580" y="485" font-size="17" fill="#fcd884" font-weight="400" text-anchor="start">→ inconclusive</text>
<text x="550" y="511" font-size="18" fill="#86efc0" font-weight="700" text-anchor="start">4</text>
<text x="580" y="511" font-size="20" fill="#f4f8ff" font-weight="600" text-anchor="start">Else → pass</text>
<text x="550" y="587" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">Unknown applicability is</text>
<text x="550" y="611" font-size="17" fill="#bdcfe1" font-weight="400" text-anchor="start">counted separately.</text>
<rect x="32" y="656" width="816" height="136" rx="16" fill="#152d49" stroke="#416180" stroke-width="1.5"/>
<text x="52" y="691" font-size="21" fill="#67e8db" font-weight="700" text-anchor="start">At requirement level</text>
<text x="52" y="722" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">A valid fail wins. Otherwise, a passing alternative can satisfy the requirement,</text>
<text x="52" y="747" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">even when another path has an error. Reviewed mode also requires approval.</text>
<text x="52" y="772" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Recommended and optional requirements do not change the overall outcome.</text>
</g>
</svg>
