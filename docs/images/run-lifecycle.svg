<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" role="img" aria-labelledby="title desc">
  <rect x="0.5" y="0.5" width="879" height="559" rx="12" fill="#ffffff" stroke="#767676" stroke-width="1" />
  <title id="title">One run, end to end</title>
  <desc id="desc">One run: plan and run take the ICS, IXIT, and operator inputs, and only the run reaches the system under test through the policy-enforcing transport. Replay, signing, and standalone verification work offline.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse" markerUnits="strokeWidth">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#767676" />
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif">
    <text x="24" y="38" font-size="18" fill="#1a1a1a" font-weight="600">One run, end to end</text>
    <path d="M 190 76 L 190 504" fill="none" stroke="#767676" stroke-width="1" />
    <path d="M 400 76 L 400 504" fill="none" stroke="#767676" stroke-width="1" />
