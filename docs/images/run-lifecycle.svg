      <tspan x="210" dy="16">transport</tspan>
    </text>
    <text x="210" y="398" font-size="12" fill="#4a4a4a">allowlisted; read-only default</text>
    <rect x="200" y="452" width="184" height="54" rx="6" fill="#ffffff" stroke="#767676" stroke-width="1" stroke-dasharray="5 4" />
