    <text x="730" y="66" font-size="12" fill="#4a4a4a" font-weight="600">Recipient</text>
    <rect x="24" y="82" width="156" height="158" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="34" y="102.0" font-size="12" fill="#4a4a4a">From the system owner</text>
    <rect x="24" y="256" width="156" height="262" rx="6" fill="#f3f3f3" stroke="#767676" stroke-width="1" />
    <text x="34" y="276.0" font-size="12" fill="#4a4a4a">From the operator</text>
    <path d="M 170 132 H 186 V 131 H 200" fill="none" stroke="#0b4f9e" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" aria-label="ICS to plan: untrusted input" />
