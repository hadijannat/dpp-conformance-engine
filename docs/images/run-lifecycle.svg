<text x="32" y="80" font-size="30" fill="#f4f8ff" font-weight="700" text-anchor="start">One run, end to end</text>
<text x="32" y="110" font-size="18" fill="#bdcfe1" font-weight="400" text-anchor="start">Live checks first. Evidence can be used offline.</text>
