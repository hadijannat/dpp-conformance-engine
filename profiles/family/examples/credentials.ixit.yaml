# Synthetic test information for the profile family/credentials against the loopback reference system.
# Project-authored example. The origin options equal those of fixtures/reference/ev.ixit.yaml.
# Start the reference system first: python -m dppce.infrastructure.reference_server
# integrity.jws verifies the dpp+jws token, which the reference system signs with an x5c chain.
# integrity.jose verifies the vc+jwt credential that the reference system serves for
# Accept: application/vc+jwt.
schema_version: dppce.ixit/1
endpoints:
  api: https://id.example.test
  public_origin: https://id.example.test
  origin_override: http://127.0.0.1:8765
samples:
  identifier: https://id.example.test/01/09506000134352/21/EV0001
  passport_id: 09506000134352-EV0001
  # TP-VC-CONSISTENCY-001 compares credentialSubject.id of this unsigned credential with the
  # carrier identifier. Replace it with a credential of the system under test.
  vc_json: TEST-ONLY-vc-subject.json
resources:
  item:
    endpoint: api
    path: /dpp/{id}
  signed:
    endpoint: api
    path: /dpp/{id}/signed
network:
  allowed_hosts:
  - 127.0.0.1
  allow_private_hosts:
  - 127.0.0.1
  max_requests: 100
  contact: reference-rig@example.test
trust:
  policy_version: TEST-ONLY-reference-1
observation:
  retention_days: 30
