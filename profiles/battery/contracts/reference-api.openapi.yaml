# Audience: contributors and assessors.
# Purpose: pin the API contract that the maintainer of the reference system supplies.
# This file is project-authored and synthetic. It makes no normative statement.
openapi: 3.1.0
# The identifier that an ICS names in api.contract. An engine-specific OpenAPI extension.
x-dppce-contract-id: battery/reference-api
info:
  title: dppce reference DPP system (synthetic)
  version: '1'
  description: Maintainer-supplied contract of the local reference system. It is an example, not a normative
    interface.
paths:
  # x-dppce-resource marks the operation that api.contract judges for an IXIT resource.
  /dpp/{id}:
    x-dppce-resource: item
    get:
      summary: Item-level passport for the role of the caller.
      responses:
        '200':
          description: The passport.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
  /dpp/{id}/model:
    x-dppce-resource: model
    get:
      summary: Shared model-level data.
      responses:
        '200':
          description: The model data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
components:
  schemas:
    Item:
      title: Synthetic item-level battery passport
      $comment: Project-authored illustrative schema. Not derived from a standard or a law.
      type: object
      additionalProperties: false
      required:
      - '@context'
      - id
      - type
      - granularity
      - model
      - category
      - operator
      - manufactured
      - rated_capacity
      - remaining_capacity
      - state_of_health_percent
      - status
      - version
      - updated_at
      properties:
        '@context': &id001
          type: array
          minItems: 1
          items:
            type: string
            format: uri
        id:
          type: string
          format: uri
        type:
          const: BatteryPassport
        granularity:
          const: item
        model:
          type: string
          format: uri
        category:
          enum:
          - ev
          - lmt
          - industrial
        operator:
          type: object
          additionalProperties: false
          required:
          - name
          - identifier
          properties:
            name:
              type: string
              minLength: 1
            identifier:
              type: string
              minLength: 1
        manufactured:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        rated_capacity:
          type: object
          additionalProperties: false
          required:
          - value
          - unit
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
        remaining_capacity:
          type: object
          additionalProperties: false
          required:
          - value
          - unit
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
        state_of_health_percent:
          type: integer
        status:
          enum:
          - original
          - repurposed
          - re-used
          - remanufactured
          - waste
        version:
          type: integer
          minimum: 1
        updated_at:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
        restricted:
          type: object
          additionalProperties: false
          properties:
            dismantling_notes:
              type: string
            supplier_reference:
              type: string
            usage_log:
              type: string
    Model:
      title: Synthetic model-level battery data
      $comment: Project-authored illustrative schema. Not derived from a standard or a law.
      type: object
      additionalProperties: false
      required:
      - '@context'
      - id
      - type
      - granularity
      - category
      - chemistry
      - nominal_voltage
      - mass
      properties:
        '@context': *id001
        id:
          type: string
          format: uri
        type:
          const: BatteryModel
        granularity:
          const: model
        category:
          enum:
          - ev
          - lmt
          - industrial
        chemistry:
          type: string
          minLength: 1
        nominal_voltage:
          type: object
          additionalProperties: false
          required:
          - value
          - unit
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - V
        mass:
          type: object
          additionalProperties: false
          required:
          - value
          - unit
          properties:
            value:
              type: integer
              minimum: 0
            unit:
              type: string
              enum:
              - kg
